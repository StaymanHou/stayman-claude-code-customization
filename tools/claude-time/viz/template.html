<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-time · dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600&family=Geist+Mono:wght@400;450;500;600&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f0eee9;
    color: #1f1c17;
    overflow: hidden;
  }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script>
  // Data inlined at emit time by the `claude-time visualize` Python subcommand.
  window.CT_DATA = {{CT_DATA_JSON}};
  // Initial view selection. Always 'day' in v3 (URL hash drives view
  // selection client-side; the emitter no longer picks a view).
  window.CT_INITIAL_VIEW = "{{CT_INITIAL_VIEW}}";
  // WP8: max-days cap for the Custom-view date-range picker. Mirrors the
  // server-side cap (cfg["viz_custom_range_max_days"], default 90). Single
  // source of truth: Python config → here → Phase 2 client-side validation.
  window.CT_MAX_RANGE_DAYS = {{CT_MAX_RANGE_DAYS}};
  // WP11: initial Compare-view preset. In v3 always null (the unified
  // `--window` emit doesn't pick a preset; URL hash drives Compare-view
  // selection client-side). One of 'wow' | 'today-vs-trailing' | 'mom' |
  // 'custom' | null. CompareView reads this via the same hash-priority
  // pattern as CT_INITIAL_VIEW (hash 'preset' wins, fallback to this).
  window.CT_INITIAL_PRESET = {{CT_INITIAL_PRESET}};
</script>

<script type="text/babel">
{{DASHBOARD_JSX}}

// ── Mount ───────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>

</body>
</html>
