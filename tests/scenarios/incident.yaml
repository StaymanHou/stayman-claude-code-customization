group: incident
scenarios:
  # I1 is ENTRY → report (always). Tested via session-start routing in session.yaml.

  - id: I2
    name: "incident:report → triage after report filed"
    skill: incident-report
    args: "Users are getting 500 errors on /api/v2/users since the 14:15 deployment. Error rate at 15%."
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: I2
      contains_any:
        - "/incident-triage"
      not_contains:
        - "/incident-investigate"
        - "/incident-mitigate"
    max_retries: 2

  - id: I3
    name: "incident:triage → investigate when severity assessed"
    skill: incident-triage
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-report-filed.md
    system_prompt_extra: |
      The human confirms: this is a P1 — major feature broken, many users
      affected, no workaround available. This needs investigation.
    expect:
      transition_id: I3
      contains_any:
        - "/incident-investigate"
      not_contains:
        - "/incident-resolve"
    max_retries: 2

  - id: I4
    name: "incident:triage fast-closes false alarm"
    skill: incident-triage
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-report-filed.md
    system_prompt_extra: |
      The human confirms: this is a false alarm. The 500 errors are from
      the legacy monitoring probe hitting a deprecated endpoint. The probe
      has already been updated. No real users were affected.
    expect:
      transition_id: I4
      contains_any:
        - "/incident-resolve"
        - "fast-close"
        - "false alarm"
      not_contains:
        - "/incident-investigate"
    max_retries: 2

  - id: I5
    name: "incident:investigate self-loops when more data needed"
    skill: incident-investigate
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-triaged.md
    system_prompt_extra: |
      You have checked the application logs and see NoneType errors in the
      serializer, but you haven't yet verified which specific field is null,
      which users are affected, or whether the migration ran correctly.
      You need to check the database and the deployment logs before you can
      confirm the root cause.
    expect:
      transition_id: I5
      contains_any:
        - "more data"
        - "continue"
        - "investigate"
        - "self-loop"
      not_contains:
        - "/incident-mitigate"
        - "/incident-resolve"
    max_retries: 2

  - id: I6
    name: "incident:investigate → mitigate when root cause found"
    skill: incident-investigate
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-triaged.md
    system_prompt_extra: |
      After thorough investigation, you have confirmed the root cause:
      the new serializer expects a profile_image_url field, but users
      created before the migration don't have it. NoneType error when
      serializing. The fix is to add a default value fallback.
    expect:
      transition_id: I6
      contains_any:
        - "/incident-mitigate"
      not_contains:
        - "/incident-resolve"
    max_retries: 2

  - id: I7
    name: "incident:investigate → resolve when false alarm discovered"
    skill: incident-investigate
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-triaged.md
    system_prompt_extra: |
      After investigation, you discovered this is actually a false alarm.
      The 500 errors were caused by a load test running against production
      by mistake. The load test has been stopped and error rates returned
      to normal immediately. No code bug exists.
    expect:
      transition_id: I7
      contains_any:
        - "/incident-resolve"
        - "false alarm"
      not_contains:
        - "/incident-mitigate"
    max_retries: 2

  - id: I8
    name: "incident:mitigate back-loops to investigate when fix fails"
    skill: incident-mitigate
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-rootcause-found.md
    system_prompt_extra: |
      You applied the default value fallback fix and deployed it, but
      the error rate only dropped from 15% to 10%. There are still 500
      errors happening. The original root cause was only part of the
      problem — there must be another issue. Need more investigation.
    expect:
      transition_id: I8
      contains_any:
        - "/incident-investigate"
        - "back-loop"
      not_contains:
        - "/incident-resolve"
    max_retries: 2

  - id: I9
    name: "incident:mitigate → resolve via skip-codify defer path"
    skill: incident-mitigate
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-rootcause-found.md
    system_prompt_extra: |
      The hotfix was deployed at 15:00. Error rate dropped to 0% by 15:05.
      It has been 30 minutes of monitoring with zero errors. The fix is
      confirmed working and stable.

      This is an active P0 with a customer escalation still open. Writing
      regression test coverage right now would delay all-clear by 20+ minutes
      while customer support is waiting on confirmation. The human explicitly
      directs: defer codify — write a SURFACE→task:plan entry to ensure the
      regression test gets written later, and go straight to resolve.
    expect:
      transition_id: I9
      contains_any:
        - "/incident-resolve"
        - "defer"
        - "SURFACE"
      not_contains:
        - "/incident-investigate"
    max_retries: 2

  - id: I10
    name: "incident:resolve always triggers reflect"
    skill: incident-resolve
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-mitigated.md
    system_prompt_extra: |
      The incident is fully resolved. Monitoring period passed with no
      regressions. The hotfix is stable.
    expect:
      transition_id: I10
      contains_any:
        - "/session-reflect"
        - "reflect"
      not_contains: []
    max_retries: 2

  - id: I11
    name: "incident:resolve surfaces small fix to task:plan"
    skill: incident-resolve
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-mitigated.md
    system_prompt_extra: |
      The incident is resolved, but the hotfix was a quick default value
      patch. The proper fix is to run a data migration to backfill
      profile_image_url for all existing users. This is a small, scoped
      task — not an architectural change.
    expect:
      transition_id: I11
      contains_any:
        - "task:plan"
        - "SURFACE"
        - "backlog"
      not_contains:
        - "feature:spec"
    max_retries: 2

  - id: I12
    name: "incident:resolve surfaces architectural fix to feature:spec"
    skill: incident-resolve
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-mitigated.md
    system_prompt_extra: |
      The incident revealed a systemic problem: the serialization layer has
      no null-safety guarantees anywhere. Every serializer assumes all fields
      are present. This needs an architectural fix — a serializer base class
      with default value handling, and all 30+ serializers need updating.
    expect:
      transition_id: I12
      contains_any:
        - "feature:spec"
        - "SURFACE"
        - "architectural"
      not_contains:
        - "task:plan"
    max_retries: 2

  # Reproduce step (I13–I16) — optional post-triage red-green discipline for reproducible incidents.

  - id: I13
    name: "incident:triage → reproduce when incident is reproducible locally"
    skill: incident-triage
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-report-filed.md
    system_prompt_extra: |
      The human confirms: this is a P1 — major feature broken, many users
      affected. The incident IS reproducible locally — the issue happens for
      any user record missing the profile_image_url field, and we have a
      deterministic test fixture for that condition. The human elects to
      run reproduction first to capture a failing test that will anchor
      both investigation and mitigation.
    expect:
      transition_id: I13
      contains_any:
        - "/incident-reproduce"
        - "reproduce"
        - "red-green"
      not_contains:
        - "/incident-investigate"
        - "/incident-resolve"
    max_retries: 2

  - id: I14
    name: "incident:reproduce → investigate when reproduced cleanly"
    skill: incident-reproduce
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-reproduce-success.md
    system_prompt_extra: |
      You wrote a failing test that asserts /api/v2/users returns 200 with
      profile_image_url null when user record has null image. The test
      currently fails with NoneType serializer error. Reproduction succeeded.
      The failing test is now the verify gate for mitigation. Hand off to
      investigate so root cause analysis can proceed with the test as anchor.
    expect:
      transition_id: I14
      contains_any:
        - "/incident-investigate"
      not_contains:
        - "pause-as-record"
        - "/incident-resolve"
    max_retries: 2

  - id: I15
    name: "incident:reproduce → investigate-with-telemetry-constraint when local reproduction fails but telemetry confirms"
    skill: incident-reproduce
    args: "dashboard-504-spikes"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-reproduce-telemetry-only.md
    system_prompt_extra: |
      You attempted to reproduce 504 errors on /api/dashboard/widgets across
      100 trials under throttled network conditions — all 100 passed locally.
      However, production telemetry confirms the incident is real: 504 spikes
      occur at p99 correlated with downstream service A's connection pool
      exhaustion. Cannot reproduce locally, but the incident is genuine.
      Hand off to investigate with the constraint that root-cause work must
      rely on production telemetry rather than a local reproducer.
    expect:
      transition_id: I15
      contains_any:
        - "/incident-investigate"
        - "telemetry"
      not_contains:
        - "pause-as-record"
        - "/incident-resolve"
    max_retries: 2

  - id: I16
    name: "incident:reproduce → pause-as-record when no reproduction and no telemetry signal"
    skill: incident-reproduce
    args: "avatar-mismatch-report"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-reproduce-no-signal.md
    system_prompt_extra: |
      Single user reported occasional avatar mismatch. You loaded 100 different
      profiles — no mismatches. Searched logs for 30 days — no avatar-related
      errors. Searched metrics — no anomalies. User cannot reproduce now either.
      No actionable signal exists. The reproduce attempt itself becomes the
      incident record. Close the workflow.
    expect:
      transition_id: I16
      contains_any:
        - "pause-as-record"
        - "record"
        - "close"
        - "no signal"
      not_contains:
        - "/incident-investigate"
        - "/incident-mitigate"
    max_retries: 2

  # Codify step (I17–I20) — regression-securing step between mitigate and resolve.

  - id: I17
    name: "incident:mitigate → codify as the default path when fix works"
    skill: incident-mitigate
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-rootcause-found.md
    system_prompt_extra: |
      The hotfix was deployed at 15:00. Error rate dropped to 0% by 15:05.
      It has been 30 minutes of monitoring with zero errors. The fix is
      confirmed working and stable. This is the normal happy-path flow —
      no active P0 pressure, no defer rationale. Codify regression coverage
      before resolving.
    expect:
      transition_id: I17
      contains_any:
        - "/incident-codify"
        - "codify"
      not_contains:
        - "/incident-resolve"
        - "/incident-investigate"
    max_retries: 2

  - id: I18
    name: "incident:codify → resolve via Path A when reproduce-artifact passes post-mitigation"
    skill: incident-codify
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-codify-with-reproduce-artifact.md
    system_prompt_extra: |
      The reproduction artifact from /incident-reproduce is a failing test at
      `tests/test_users_api.py::test_get_users_with_null_profile_image_returns_200`.
      After the mitigation (default empty string in the serializer), this test
      now passes against the mitigated code. Full test suite also passes.
      The reproduce artifact IS the regression test — Path A. No new test needs
      to be written from scratch.
    expect:
      transition_id: I18
      contains_any:
        - "/incident-resolve"
        - "Path A"
        - "artifact"
      not_contains:
        - "/incident-mitigate"
        - "/incident-investigate"
    max_retries: 2

  - id: I18-defer
    name: "incident:codify → resolve via defer path when active P0 pressure justifies SURFACE"
    skill: incident-codify
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-codify-no-reproduce.md
    system_prompt_extra: |
      No reproduce artifact exists for this incident — investigation went
      straight from triage to investigate via telemetry signals. The mitigation
      is confirmed working in prod (telemetry pattern is clean). However, the
      customer escalation is still open, and writing a regression test from
      scratch now would require ~30 minutes of test-setup work that delays
      all-clear. The human explicitly directs: defer codify — write the
      SURFACE→task:plan entry with reasoning, then proceed to resolve so the
      customer can be notified.
    expect:
      transition_id: I18
      contains_any:
        - "/incident-resolve"
        - "defer"
        - "SURFACE"
      not_contains:
        - "/incident-mitigate"
        - "/incident-investigate"
    max_retries: 2

  - id: I19
    name: "incident:codify → mitigate back-loop when codify-time test still fails"
    skill: incident-codify
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-codify-with-reproduce-artifact.md
    system_prompt_extra: |
      You ran the failing test from the reproduce artifact against the
      mitigated code. The test STILL fails — the NoneType error reappears.
      The mitigation (default empty string in the serializer) was applied but
      did not actually fix the underlying bug. The codify test is correct
      (it captures the user-visible failure mode); the mitigation must be
      reconsidered. Per the incident-codify semantic-flip rule: a codify-time
      regression-test failure means the mitigation didn't fix the bug —
      back-loop to mitigate, do not auto-fix the test.
    expect:
      transition_id: I19
      contains_any:
        - "/incident-mitigate"
        - "back-loop"
        - "mitigation"
      not_contains:
        - "/incident-resolve"
    max_retries: 2

  - id: I20
    name: "incident:codify → investigate back-loop when codify-time evidence reveals root-cause analysis was wrong"
    skill: incident-codify
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-codify-with-reproduce-artifact.md
    system_prompt_extra: |
      You ran the failing test from the reproduce artifact against the
      mitigated code — it passes cleanly. So the mitigation DID fix the
      specific case investigate identified. However, while writing additional
      regression coverage at codify time, you discovered that a sibling
      request shape ALSO produces the same NoneType 500: GET /api/v2/users
      with `?include=preferences` triggers a different serializer code path
      that has its own null-handling gap on a DIFFERENT field
      (`notification_email`, not `profile_image_url`). The original
      investigation concluded the bug was a single-field issue on
      `profile_image_url`. The new codify-time evidence contradicts that
      conclusion: the root cause is a broader pattern — multiple
      nullable-but-required fields across multiple serializer paths — not
      a single-field issue. Per the incident-codify procedure: codify-time
      evidence that reveals the root-cause analysis was wrong means
      back-loop to investigate, NOT auto-fix and NOT continue to resolve.
      Document the new evidence and hand off to re-investigate.
    expect:
      transition_id: I20
      contains_any:
        - "/incident-investigate"
        - "back-loop"
        - "root cause"
      not_contains:
        - "/incident-resolve"
        - "/incident-mitigate"
    max_retries: 2

  # F-CHGLOG-2: incident-resolve appends to project CHANGELOG.md
  # Test-only ID — no entry in transitions.md's main table; this asserts a side-effect of I10.
  - id: F-CHGLOG-2
    name: "incident:resolve appends Incident resolved line to CHANGELOG.md"
    skill: incident-resolve
    args: "api-500-errors"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/incident-mitigated.md
    system_prompt_extra: |
      The incident is fully resolved. Monitoring period passed with no
      regressions. The hotfix is stable. Per the CHANGELOG.md convention
      documented in ~/.claude/CLAUDE.md (injected from CLAUDE.snippet.md),
      append one **Incident resolved:** bullet to <proj_root>/CHANGELOG.md
      under today's date heading, summarizing the incident and its mitigation
      in one sentence. Follow the append-before-`git mv` operational sequence.
    expect:
      transition_id: I10
      contains_any:
        - "CHANGELOG"
        - "**Incident resolved:**"
        - "Incident resolved"
      not_contains: []
    max_retries: 2
