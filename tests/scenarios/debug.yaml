group: debug
scenarios:
  # debug-bisect-known-good has TWO conjunctive gates. The first scenario asserts
  # that the procedure activates when both gates clearly hold. The next two assert
  # that the gate-check exits cleanly (DEBUG-BISECT-SKIP) when either gate fails —
  # because misapplying bisect is wasted effort, and the SKILL's first §1 step is
  # an explicit Gate Check that writes a SKIP token on either failure.

  - id: DEBUG-BISECT-GATE-MET
    name: "debug-bisect-known-good: both gates hold → procedure activates"
    skill: debug-bisect-known-good
    args: >
      Playwright window invisible on amazon-affiliate worker; ebay-affiliate worker
      (same base class, same Docker container, same Playwright version) shows the
      window correctly. 4 failed straight-line debug attempts, no converging
      hypothesis. Need to localize the cause.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-bisect-gates-met.md
    # No `not_contains` — this is an entry-state scenario where the skill stays
    # IN the bisect procedure. Per CLAUDE.md routing-fork guidance, aggressive
    # not_contains constraints on entry-state scenarios are prose-leak-fragile
    # (the model often mentions alternative tokens in negation when describing
    # the procedure). The structured transition_id assertion is sufficient.
    expect:
      transition_id: DEBUG-BISECT-START
      contains_any:
        - "B0"
        - "baseline"
        - "Building"
        - "clone"
    max_retries: 2

  - id: DEBUG-BISECT-NO-KNOWN-GOOD
    name: "debug-bisect-known-good: no known-good sibling → SKIP"
    skill: debug-bisect-known-good
    args: >
      Single-tenant data-export job hangs after ~30 min for tenant acme-corp.
      No other tenant uses this code path — there is no sibling working runner
      to bisect from. Multiple straight-line debug attempts already tried.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-bisect-no-known-good.md
    expect:
      transition_id: DEBUG-BISECT-SKIP
      contains_any:
        - "no known-good"
        - "not applicable"
        - "Gate 1"
        - "sibling"
      not_contains:
        - "DEBUG-BISECT-START"
        - "DEBUG-BISECT-COMPLETE"
    max_retries: 2

  - id: DEBUG-BISECT-INSUFFICIENT-ATTEMPTS
    name: "debug-bisect-known-good: only 1 straight-line attempt → SKIP"
    skill: debug-bisect-known-good
    args: >
      Premium-plan digest send fails on digest_renderer.render_premium_section;
      free-plan and team-plan digests work (known-good siblings exist). Only one
      straight-line debug attempt so far — read the stack trace.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-bisect-insufficient-attempts.md
    expect:
      transition_id: DEBUG-BISECT-SKIP
      contains_any:
        - "Gate 2"
        - "fewer than 3"
        - "straight-line"
        - "attempts"
      not_contains:
        - "DEBUG-BISECT-START"
        - "DEBUG-BISECT-COMPLETE"
    max_retries: 2

  # debug-empirical-telemetry has TWO conjunctive gates. Same shape as bisect's
  # 3-scenario pair: GATE-MET asserts the procedure activates (DEBUG-TELEMETRY-START);
  # INSUFFICIENT-ATTEMPTS asserts Gate-1 SKIP; STATIC-DERIVABLE asserts Gate-2 SKIP.

  - id: DEBUG-TELEMETRY-GATE-MET
    name: "debug-empirical-telemetry: both gates hold → procedure activates"
    skill: debug-empirical-telemetry
    args: >
      Background worker processQueue() occasionally processes the same job twice
      (1 in 30 runs). The dequeue SQL uses UPDATE...RETURNING WHERE locked_at IS NULL
      FOR UPDATE SKIP LOCKED — looks atomic on paper. 3 failed straight-line debug
      attempts: read the dequeue query, read the release_lock path, stared at the
      worker loop. Race condition is not visible in static reading. Need to observe
      what each worker is doing at the moment a duplicate fires.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-empirical-telemetry-gates-met.md
    # No `not_contains` — this is an entry-state scenario where the skill stays
    # IN the procedure. Per CLAUDE.md "Test scenario design — routing-fork patterns",
    # aggressive not_contains on entry-state scenarios is prose-leak fragile.
    expect:
      transition_id: DEBUG-TELEMETRY-START
      contains_any:
        - "instrument"
        - "observe"
        - "telemetry"
        - "Gate 1"
        - "Gate 2"
    max_retries: 2

  - id: DEBUG-TELEMETRY-INSUFFICIENT-ATTEMPTS
    name: "debug-empirical-telemetry: only 1 static-reasoning attempt → SKIP"
    skill: debug-empirical-telemetry
    args: >
      GET /api/users/12345 returns 500 with KeyError 'preferences' in the serializer.
      Only one static-reasoning attempt so far — read the serializer line. Have not
      yet checked the DB row, compared to working user IDs, or looked at recent
      migrations. Gate-2 may hold (bug-shape involves runtime DB state) but Gate-1
      (≥2–3 failed static attempts) does NOT hold.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-empirical-telemetry-gate1-fails.md
    expect:
      transition_id: DEBUG-TELEMETRY-SKIP
      contains_any:
        - "Gate 1"
        - "fewer than"
        - "static"
        - "attempts"
        - "straight-line"
      not_contains:
        - "DEBUG-TELEMETRY-START"
        - "DEBUG-TELEMETRY-COMPLETE"
    max_retries: 2

  - id: DEBUG-TELEMETRY-STATIC-DERIVABLE
    name: "debug-empirical-telemetry: bug is static-derivable typo → SKIP"
    skill: debug-empirical-telemetry
    args: >
      User-onboarding flow crashes with KeyError 'emial' at config_loader.py:42
      (config["emial"]). Config schema documents the field as 'email'. Every other
      lookup in the codebase uses 'email' correctly. The cause is a 1-character
      typo, fully visible by reading the line. No runtime evidence needed — Gate 2
      fails (the bug is statically derivable).
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-empirical-telemetry-gate2-fails.md
    expect:
      transition_id: DEBUG-TELEMETRY-SKIP
      contains_any:
        - "Gate 2"
        - "static"
        - "typo"
        - "read the code"
        - "derivable"
      not_contains:
        - "DEBUG-TELEMETRY-START"
        - "DEBUG-TELEMETRY-COMPLETE"
    max_retries: 2

  - id: DEBUG-TELEMETRY-INCONCLUSIVE
    name: "debug-empirical-telemetry: 3 rounds exhausted, no converging observable → INCONCLUSIVE"
    skill: debug-empirical-telemetry
    model: sonnet  # Haiku flakes: describe-then-escalate paths are noisy on haiku. Sonnet behavior: SOFT_PASS lenient (contains 'inconclusive' but model emits TRANSITION line in a shape that captures only the prefix "DEBUG" via the harness regex — likely a markdown-decorated emit like `**TRANSITION: DEBUG**-TELEMETRY-INCONCLUSIVE`). Lenient coverage > no coverage; the contains_any list catches the behavioral signal even when the structured TRANSITION line shape is fragile. See backlog SURFACE-2026-06-10-DEBUG-TELEMETRY-INCONCLUSIVE-SCENARIO and SURFACE-2026-06-12-DEBUG-TELEMETRY-INCONCLUSIVE-STRICT-PASS-NEEDED for the strict-fix follow-up.
    args: >
      Worker processQueue() duplicate-fires bug. 3 prior telemetry rounds already
      ran: (1) instrumented dequeue boundary — SKIP LOCKED works correctly,
      H1 ruled out; (2) instrumented release_lock/handler ordering — handler
      fires once per dequeue, H2 ruled out; (3) instrumented downstream sink —
      receives two distinct legitimate events from two workers separated by
      15-30 min, H3 ruled out. The visible observable space is exhausted —
      the duplicate manifests across distinct dequeues, but the dequeue
      protocol prevents concurrent access. Do NOT run a 4th telemetry round.
      Acknowledge inconclusive, run cleanup, escalate.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/debug-empirical-telemetry-inconclusive.md
    # No `not_contains` — this is an in-procedure terminal scenario where
    # the skill stays IN the empirical-telemetry mode while emitting the
    # INCONCLUSIVE termination. Per CLAUDE.md "Test scenario design — routing-
    # fork patterns", aggressive not_contains on in-procedure scenarios is
    # prose-leak fragile.
    expect:
      transition_id: DEBUG-TELEMETRY-INCONCLUSIVE
      contains_any:
        - "inconclusive"
        - "exhausted"
        - "escalate"
        - "escalation"
        - "alternative"
        - "ruled out"
    max_retries: 2
