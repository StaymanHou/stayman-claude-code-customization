group: feature
scenarios:
  # F1 and F2 are ENTRY routing — tested via session-start in session.yaml.
  # We also test them explicitly here by invoking the skills directly.

  - id: F1
    name: "feature:spec entered for complex feature"
    skill: feature-spec
    args: >
      Build a real-time collaborative editing system with conflict resolution,
      presence indicators, offline sync, and multi-cursor support.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: F1
      contains_any:
        - "spec"
        - "specification"
      not_contains: []
    max_retries: 2

  - id: F3
    name: "feature:spec → research when unknowns exist"
    skill: feature-spec
    args: "Real-time collaboration feature"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-unknowns.md
    system_prompt_extra: |
      The spec has multiple open questions: which real-time protocol
      (WebSocket vs SSE vs WebTransport), how to handle conflict resolution
      (OT vs CRDT), and acceptable latency for presence. These must be
      researched before planning.
    expect:
      transition_id: F3
      contains_any:
        - "/feature-research"
      not_contains:
        - "/feature-plan"
    max_retries: 2

  - id: F4
    name: "feature:spec → plan when spec is clear"
    skill: feature-spec
    args: "User notification preferences"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-clear.md
    system_prompt_extra: |
      The specification is complete. No open questions. All acceptance
      criteria are clear. No unknowns to research.
    expect:
      transition_id: F4
      contains_any:
        - "/feature-plan"
      not_contains:
        - "/feature-research"
    max_retries: 2

  - id: F5
    name: "feature:research → plan when research complete"
    skill: feature-research
    args: "WebSocket vs SSE for real-time collaboration"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-unknowns.md
    system_prompt_extra: |
      Research is complete. Findings: WebSocket is the right choice for
      bidirectional real-time editing. CRDT (Yjs library) handles conflict
      resolution. 100ms latency is acceptable for presence. All questions
      answered. The spec remains valid.
    expect:
      transition_id: F5
      contains_any:
        - "/feature-plan"
      not_contains:
        - "/feature-spec"
    max_retries: 2

  - id: F6
    name: "feature:research back-loops to spec when spec is wrong"
    skill: feature-research
    args: "WebSocket vs SSE for real-time collaboration"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-unknowns.md
    system_prompt_extra: |
      Research reveals a critical problem: the spec assumed we could use a
      simple WebSocket server, but the existing infrastructure is behind a
      load balancer that doesn't support sticky sessions. The spec needs to
      be revised to account for a pub/sub architecture instead of direct
      WebSocket connections.
    expect:
      transition_id: F6
      contains_any:
        - "/feature-spec"
        - "back-loop"
        - "spec"
      not_contains:
        - "/feature-plan"
    max_retries: 2

  - id: F7
    name: "feature:plan → build (phase 1)"
    skill: feature-plan
    args: "User notification preferences"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-clear.md
    expect:
      transition_id: F7
      contains_any:
        - "/feature-build"
      not_contains:
        - "/feature-ship"
    max_retries: 2

  - id: F8
    name: "feature:build → verify-auto when phase complete"
    skill: feature-build
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      All Phase 1 steps are complete: notification_preferences table created,
      CRUD endpoints implemented, default preferences added on user creation.
      All code changes are done for this phase.
    expect:
      transition_id: F8
      contains_any:
        - "/feature-verify-auto"
      not_contains:
        - "/feature-plan"
        - "/feature-ship"
    max_retries: 2

  - id: F9
    name: "feature:verify-auto back-loops to build when tests fail"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      Test results: 20 tests passed, 3 FAILED.
      - test_create_preferences: AssertionError expected 201 got 400
      - test_update_preferences: KeyError 'email_enabled'
      - test_default_preferences: AssertionError missing default for 'sms'
      These are code bugs in the implementation, not spec problems.
    expect:
      transition_id: F9
      contains_any:
        - "/feature-build"
      not_contains:
        - "/feature-verify-human"
        - "/feature-spec"
    max_retries: 2

  - id: F10
    name: "feature:verify-auto → verify-self when tests pass"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      Test results: 24 tests passed, 0 failed. Linting clean. Type
      checking clean. All automated checks pass.
    expect:
      transition_id: F10
      contains_any:
        - "/feature-verify-self"
      not_contains:
        - "/feature-verify-human"
        - "/feature-build"
        - "/feature-spec"
    max_retries: 2

  - id: F13-prefiltered
    name: "feature:verify-human excludes verify-self [x] items from checklist"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      verify-self completed with all outcomes [x] (PASS):
      - P1.verify-self.1 GET /api/notification-preferences → 200: PASS [x]
      - P1.verify-self.2 PUT /api/notification-preferences/:category → 200: PASS [x]
      - P1.verify-self.3 Browser /settings/notifications no JS errors: PASS [x]
      The human checklist must NOT include any of these items — they were
      already confirmed by the agent. The human should only see items that
      require genuine human judgment. Human approves the phase.
    expect:
      transition_id: F13
      contains_any:
        - "/feature-verify-codify"
      not_contains:
        - "P1.verify-self.1"
        - "P1.verify-self.2"
        - "P1.verify-self.3"
        - "GET /api/notification-preferences"
    max_retries: 2

  - id: F8-reverify
    name: "feature:build re-verify gate confirms fix before transitioning to verify-auto"
    skill: feature-build
    args: "P1.verify-self.1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-blocking.md
    system_prompt_extra: |
      Re-entering build from a verify-self back-loop (F9b). The previously
      failing outcome was: GET /api/notification-preferences → 500 (missing
      DB migration). You have applied the fix (ran the migration). Before
      transitioning to verify-auto, re-run the behavioral check:
      curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/notification-preferences
      returns 200. The re-verify passes. Now transition to verify-auto.
    expect:
      transition_id: F8
      contains_any:
        - "/feature-verify-auto"
        - "re-verify"
        - "confirmed"
        - "passes"
      not_contains:
        - "/feature-verify-human"
        - "/feature-plan"
    max_retries: 2

  - id: F10-clarified
    name: "feature:verify-auto recommends cheap/scoped checks, not full test suite"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      The build step just created a new Python module: notification_preferences.py.
      Run appropriate cheap, fast, scoped checks for this specific file only.
      Do NOT run the full pytest suite. Appropriate checks include: syntax check,
      lint, and an import smoke test (e.g. python -c "from notification_preferences
      import NotificationPreferences"). All checks pass.
    expect:
      transition_id: F10
      contains_any:
        - "/feature-verify-self"
        - "syntax"
        - "lint"
        - "import"
        - "smoke"
      not_contains:
        - "full test suite"
        - "run all tests"
        - "pytest -v"
    max_retries: 2

  - id: F9b
    name: "feature:verify-self back-loops to build on BLOCKING failure"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-blocking.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/notification-preferences → 200
      status: FAIL
      severity: BLOCKING
      detail: Returns 500 Internal Server Error — missing DB migration
      ---
      outcome: PUT /api/notification-preferences/:category → 200
      status: FAIL
      severity: BLOCKING
      detail: BLOCKED — cannot test because GET endpoint is broken
      ---
      outcome: Browser /settings/notifications no JS console errors
      status: FAIL
      severity: COSMETIC
      detail: Minor spacing misalignment on toggle row, no JS errors
      ```

      There is one BLOCKING failure. The agent must back-loop to build.
    expect:
      transition_id: F9b
      contains_any:
        - "/feature-build"
        - "BLOCKING"
        - "back-loop"
      not_contains:
        - "/feature-verify-human"
    max_retries: 2

  - id: F9b-rerun
    name: "feature:verify-self cosmetic-only failure does NOT back-loop — forwards to verify-human"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/notification-preferences → 200
      status: PASS
      severity: N/A
      detail: Returns 200 with correct body
      ---
      outcome: PUT /api/notification-preferences/:category → 200
      status: PASS
      severity: N/A
      detail: Persisted correctly on re-fetch
      ---
      outcome: Browser /settings/notifications no JS errors
      status: FAIL
      severity: COSMETIC
      detail: Toggle labels have slightly inconsistent padding (no JS errors, no crash)
      ```

      One COSMETIC failure exists. COSMETIC failures do NOT trigger a back-loop.
      Forward to verify-human and note the cosmetic item.
    expect:
      transition_id: F10b
      contains_any:
        - "/feature-verify-human"
        - "cosmetic"
        - "COSMETIC"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F10b
    name: "feature:verify-self → verify-human when all blocking outcomes pass"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/notification-preferences → 200
      status: PASS
      severity: N/A
      detail: Returns 200 with body [{category: "email", enabled: true}]
      ---
      outcome: PUT /api/notification-preferences/email with {"enabled": false} → 200
      status: PASS
      severity: N/A
      detail: Re-fetch returns enabled: false — persisted correctly
      ---
      outcome: Browser /settings/notifications no JS console errors
      status: PASS
      severity: N/A
      detail: Page loads cleanly, no console errors
      ```

      All blocking outcomes pass. No cosmetic issues. Forward to verify-human.
    expect:
      transition_id: F10b
      contains_any:
        - "/feature-verify-human"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F11
    name: "feature:verify-human skips to verify-codify with reasoning"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-auto-passed.md
    system_prompt_extra: |
      Phase 1 is purely backend API work — database table and REST
      endpoints. There is no UI, no user-facing interface to manually
      test. Full automated test coverage exists for all endpoints.
      The human confirms there is nothing to manually test.
    expect:
      transition_id: F11
      contains_any:
        - "/feature-verify-codify"
        - "nothing to manually test"
        - "skip"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F12
    name: "feature:verify-human back-loops to build when human rejects"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-auto-passed.md
    system_prompt_extra: |
      The human tested the API endpoints and found issues:
      - The PATCH endpoint doesn't validate that category names exist
      - The GET endpoint returns 200 with empty body instead of 404 for
        non-existent users
      - The response format doesn't match the documented API contract
      Human rejects this phase.
    expect:
      transition_id: F12
      contains_any:
        - "/feature-build"
        - "back-loop"
      not_contains:
        - "/feature-verify-codify"
        - "/feature-ship"
    max_retries: 2

  - id: F13
    name: "feature:verify-human → verify-codify when approved"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-auto-passed.md
    system_prompt_extra: |
      The human verified the API endpoints:
      - GET /preferences returns correct defaults for new users
      - PATCH /preferences updates correctly
      - Invalid category returns 400
      All happy paths work. Human approves.
    expect:
      transition_id: F13
      contains_any:
        - "/feature-verify-codify"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F14
    name: "feature:verify-codify back-loops when tests reveal issues"
    skill: feature-verify-codify
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-human-approved.md
    system_prompt_extra: |
      While writing comprehensive tests, you discovered that concurrent
      PATCH requests to the same user's preferences cause a race condition.
      The human didn't catch this because they tested sequentially. This
      is a real bug that the human should verify the fix for.
    expect:
      transition_id: F14
      contains_any:
        - "/feature-verify-human"
        - "back-loop"
      not_contains:
        - "/feature-build"
        - "/feature-ship"
    max_retries: 2

  - id: F15
    name: "feature:verify-codify → build (next phase) when more phases"
    skill: feature-verify-codify
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-human-approved.md
    system_prompt_extra: |
      Comprehensive tests written and all pass. Phase 1 (Backend API) is
      fully verified. Phase 2 (Frontend Settings UI) still remains.
    expect:
      transition_id: F15
      contains_any:
        - "/feature-build"
        - "phase 2"
        - "next phase"
      not_contains:
        - "/feature-ship"
    max_retries: 2

  - id: F16
    name: "feature:verify-codify → ship when all phases done"
    skill: feature-verify-codify
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      All comprehensive tests written and passing. Both Phase 1 and Phase 2
      are fully verified. No more phases remain. Feature is ready to ship.
    expect:
      transition_id: F16
      contains_any:
        - "/feature-ship"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F17
    name: "feature:ship → finalize"
    skill: feature-ship
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      All cleanup done. No temporary files. Tests pass. PR is ready.
    expect:
      transition_id: F17
      contains_any:
        - "/feature-finalize"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F18
    name: "feature:finalize → refactor when tech debt found"
    skill: feature-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-finalized-with-debt.md
    system_prompt_extra: |
      Documentation is updated. But during review, the following tech debt
      was identified: duplicated validation logic, N+1 query, and copy-pasted
      test helpers. These should be cleaned up.
    expect:
      transition_id: F18
      contains_any:
        - "/feature-refactor"
        - "tech debt"
      not_contains:
        - "/session-reflect"
    max_retries: 2

  - id: F19
    name: "feature:finalize exits with reflect when no debt"
    skill: feature-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-finalized-no-debt.md
    system_prompt_extra: |
      Documentation updated. Code reviewed. No tech debt identified.
      Feature is clean and complete.
    expect:
      transition_id: F19
      contains_any:
        - "/session-reflect"
        - "reflect"
        - "complete"
      not_contains:
        - "/feature-refactor"
    max_retries: 2

  - id: F19-dualclose
    name: "feature:finalize produces both retrospect artifact and communicate step"
    skill: feature-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-finalized-no-debt.md
    system_prompt_extra: |
      Documentation updated. Code reviewed. No tech debt identified.
      Feature is clean and complete. Before archiving, you must produce two
      separate outputs: (A) a retrospect artifact documenting what changed in
      your understanding during the feature, and (B) a communicate step — a
      closure notice confirming the requester knows the feature is done and
      what it does. Both outputs are required.
    expect:
      transition_id: F19
      contains_any:
        - "Retrospect"
        - "retrospect"
        - "what changed"
      not_contains:
        - "/feature-refactor"
    max_retries: 2

  - id: F20
    name: "feature:refactor → plan (cleanup-only constraint)"
    skill: feature-refactor
    args: "Deduplicate validation logic and fix N+1 query"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-finalized-with-debt.md
    system_prompt_extra: |
      The refactor is complex — it touches the validation layer in both
      frontend and backend, requires extracting a shared validation module,
      and the N+1 fix requires a query rewrite affecting 3 endpoints.
      This needs a plan before executing.
    expect:
      transition_id: F20
      contains_any:
        - "/feature-plan"
        - "plan"
        - "cleanup"
      not_contains:
        - "/feature-spec"
    max_retries: 2

  - id: F21
    name: "feature:refactor exits with reflect when complete"
    skill: feature-refactor
    args: "Fix copy-pasted test helpers"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-finalized-with-debt.md
    system_prompt_extra: |
      The refactor is simple: extract create_test_preferences() into a
      shared conftest.py fixture. This is a 10-line change in 5 files.
      Done — tests all pass. No further refactoring needed.
    expect:
      transition_id: F21
      contains_any:
        - "/session-reflect"
        - "reflect"
        - "complete"
      not_contains:
        - "/feature-plan"
    max_retries: 2

  - id: F22
    name: "feature:build redirects to research on unknown"
    skill: feature-build
    args: "phase 2 — payment integration"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      While implementing the notification preferences UI, you discover
      that the project uses a custom design system component library
      that is undocumented. You cannot figure out how to create a toggle
      switch component without understanding the library's API. This
      requires research before continuing.
    expect:
      transition_id: F22
      contains_any:
        - "/feature-research"
        - "REDIRECT"
        - "research"
      not_contains:
        - "/feature-verify-auto"
    max_retries: 2

  - id: F23
    name: "feature:build back-loops to plan when plan is wrong"
    skill: feature-build
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      While implementing, you discover the plan missed a critical step:
      the notification_preferences table needs a foreign key to a
      notification_categories table that doesn't exist yet. The plan
      needs to be revised to add category management as a prerequisite.
    expect:
      transition_id: F23
      contains_any:
        - "/feature-plan"
        - "back-loop"
        - "re-plan"
      not_contains:
        - "/feature-verify-auto"
        - "/feature-research"
    max_retries: 2

  - id: F23-recheck
    name: "feature:build back-loop re-entry records problem statement re-check"
    skill: feature-build
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      You are re-entering feature-build from a back-loop (F23 — plan was wrong).
      The original problem was: users can't configure notifications.
      During the failed phase, you learned that the notification system was
      recently redesigned: notifications are now opt-in by default, not opt-out.
      The root problem has shifted — the solution approach needs to change.
      Before implementing, you must record whether the root problem has changed
      and update the Problem Statement in the WIP file accordingly.
    expect:
      transition_id: F23-recheck
      contains_any:
        - "root problem"
        - "problem statement"
        - "Problem Statement"
        - "Updated"
        - "changed"
      not_contains:
        - "/feature-verify-auto"
    max_retries: 2

  - id: F24
    name: "feature:verify-auto back-loops to spec when spec is wrong"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      Tests reveal a fundamental spec problem: the acceptance criteria say
      "changes save immediately" but the test for concurrent saves shows
      the database can't handle the write volume. The spec assumed a simple
      save model, but the actual requirement needs eventual consistency
      with optimistic locking. The spec itself needs revision.
    expect:
      transition_id: F24
      contains_any:
        - "/feature-spec"
        - "spec"
      not_contains:
        - "/feature-build"
        - "/feature-verify-human"
    max_retries: 2

  - id: F25
    name: "feature:build surfaces to product:wbs (note-and-continue)"
    skill: feature-build
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      While implementing preferences, you notice that the project has no
      audit logging system. Every preference change should be logged for
      compliance, but there's no audit module in the WBS. This doesn't
      block your current work — you can add preferences without audit
      logging — but it should be tracked as new work.
    expect:
      transition_id: F25
      contains_any:
        - "SURFACE"
        - "product:wbs"
        - "backlog"
        - "note-and-continue"
      not_contains:
        - "ESCALATE"
        - "pause"
    max_retries: 2

  - id: F26
    name: "feature:build surfaces to product:arch (pause-and-escalate)"
    skill: feature-build
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      While implementing the preferences API, you discover that the
      database is PostgreSQL but the architecture spec says the notification
      delivery system will use MongoDB for event storage. The preferences
      table needs to reference notification events, but you can't design
      the foreign key relationship without knowing whether to use cross-DB
      references or denormalize. This is an architectural blocker — you
      cannot continue implementation without this decision.
    expect:
      transition_id: F26
      contains_any:
        - "SURFACE"
        - "product:arch"
        - "pause"
        - "escalate"
        - "blocker"
      not_contains:
        - "note-and-continue"
    max_retries: 2

  # Work Tree format scenarios (Phase 1 codification)

  - id: F7-observable-outcomes
    name: "feature:plan emits mechanically verifiable Observable outcomes (not prose)"
    skill: feature-plan
    args: "User login page"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-clear.md
    system_prompt_extra: |
      Create a phased plan for a user login page. Observable outcomes in the
      Work Tree must be mechanically verifiable (HTTP status codes, Playwright
      selectors, CLI commands) — NOT prose like "the page looks correct" or
      "the feature works". Each phase must include at least one HTTP, Browser,
      or CLI outcome.
    expect:
      transition_id: F7
      contains_any:
        - "HTTP:"
        - "Browser:"
        - "CLI:"
        - "curl"
        - "Playwright"
        - "exits 0"
        - "→ 200"
      not_contains:
        - "looks correct"
        - "works correctly"
        - "functions properly"
    max_retries: 2

  - id: F7-worktree
    name: "feature:plan emits Work Tree format with Observable Outcomes"
    skill: feature-plan
    args: "User notification preferences"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-clear.md
    system_prompt_extra: |
      Create a phased plan. The output WIP file must use the Work Tree format
      with Observable Outcomes per phase and all 5 verification group nodes
      pre-populated as NOT-STARTED.
    expect:
      transition_id: F7
      contains_any:
        - "## Work Tree"
        - "Observable outcomes"
      not_contains:
        - "## Implementation Phases"
    max_retries: 2

  - id: F7-relevance
    name: "feature:plan phase-advance records relevance gate before Phase 2"
    skill: feature-plan
    args: "User notification preferences — advancing to Phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      Phase 1 (Backend API) is complete. You are now advancing to Phase 2
      (Frontend Settings UI). Before starting Phase 2, you must run the
      relevance gate: check that the requester still needs the feature,
      requirements are unchanged, the solution is still feasible, and no
      superior alternative has been discovered. Record the result in the
      WIP file under the Phase 2 node before writing the phase plan.
    expect:
      transition_id: F7
      contains_any:
        - "Relevance check"
        - "relevance check"
        - "relevance gate"
        - "still warranted"
        - "still needed"
        - "still feasible"
      not_contains:
        - "/feature-ship"
    max_retries: 2

  - id: F12-scoped
    name: "feature:verify-human back-loop includes specific failed leaf IDs"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-human-partial-failure.md
    system_prompt_extra: |
      P1.verify-human.1 (GET preferences returns correct shape) has FAILED —
      the response body is missing the 'category' field. P1.verify-human.2
      is BLOCKED because it depends on P1.verify-human.1. P1.verify-human.3
      is NOT-STARTED. Human rejects this phase based on the failure.
    expect:
      transition_id: F12
      contains_any:
        - "P1.verify-human.1"
        - "verify-human.1"
      not_contains:
        - "/feature-verify-codify"
        - "/feature-ship"
    max_retries: 2

  - id: F12-blocked
    name: "feature:verify-human shows BLOCKED items explicitly, not silently skipped"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-human-partial-failure.md
    system_prompt_extra: |
      P1.verify-human.1 FAILED. P1.verify-human.2 is BLOCKED because it
      depends on P1.verify-human.1. The agent must present P1.verify-human.2
      as explicitly BLOCKED — not skip it silently.
    expect:
      transition_id: F12
      contains_any:
        - "BLOCKED"
        - "blocked"
        - "depends on"
      not_contains:
        - "/feature-verify-codify"
    max_retries: 2

  - id: F8-scoped
    name: "feature:build scoped re-entry restricts to named leaf IDs only"
    skill: feature-build
    args: "P1.verify-human.1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-scoped-reentry.md
    system_prompt_extra: |
      Re-entering build with scoped args P1.verify-human.1. Fix only this
      leaf — the GET /api/notification-preferences endpoint is returning
      objects without the 'category' field. P1.verify-human.2 is already
      passing and must NOT be touched. P2 (Frontend) must NOT be touched.
    expect:
      transition_id: F8
      contains_any:
        - "P1.verify-human.1"
        - "verify-human.1"
      not_contains:
        - "P2"
        - "Frontend"
        - "P1.verify-human.2"
    max_retries: 2

