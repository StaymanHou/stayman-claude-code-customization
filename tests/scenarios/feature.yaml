  - id: F31
    name: "feature:reproduce entered for bug-shape feature"
    skill: feature-reproduce
    args: >
      The order-flip regression: after verify-codify on the final phase, the
      agent's closing prose says "Ready for feature-finalize → feature-ship" —
      ship and finalize are inverted.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    system_prompt_extra: |
      This is the bug-shape entry point. The user has described an undesirable
      behavior. Your job is to attempt reproduction (red-green discipline) — write
      a failing test, document a deterministic recipe, or capture a telemetry
      signature. You have NOT yet decided whether reproduction succeeded — you
      are entering the reproduce state. Do not skip ahead to spec or plan.
    expect:
      transition_id: F31
      contains_any:
        - "reproduce"
        - "Reproduce"
        - "failing test"
        - "red-green"
      not_contains:
        - "/feature-spec"
        - "/feature-plan"
    max_retries: 2

  - id: F32
    name: "feature:reproduce → spec when reproduced cleanly + complex feature"
    skill: feature-reproduce
    args: >
      Real-time order-flip regression touching multiple skills, AGENTS.md,
      transitions.md, and tests across 3 workflows. Write a failing test that
      asserts the correct prose order and confirm it fails.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-reproduce-success.md
    system_prompt_extra: |
      You have written a failing test (`tests/scenarios/feature.yaml::F16-order`)
      that asserts verify-codify mentions /feature-ship before /feature-finalize.
      The test currently fails. Reproduction succeeded. The fix is complex —
      multiple skills, multiple workflows, more than 200 lines, requires
      architectural decisions. This fails the small/simple criteria.
      Hand off to spec.
    expect:
      transition_id: F32
      contains_any:
        - "/feature-spec"
      not_contains:
        - "/feature-plan"
        - "terminate"
    max_retries: 2

  - id: F33
    name: "feature:reproduce → plan when reproduced cleanly + small/simple feature"
    skill: feature-reproduce
    args: >
      Typo in error message: when login fails with invalid email format, the
      response says "Email is not a vaild email" (typo: vaild). Should say "valid".
    fixtures:
      claude_md: fixtures/CLAUDE.md
    system_prompt_extra: |
      You wrote a failing test that asserts the response text matches "valid"
      not "vaild". The test currently fails. Reproduction succeeded. The fix is
      a one-line string change in one file — no new data models, no architecture,
      describable in 1 sentence, under 5 minutes of work, ~1 line changed. All
      small/simple criteria are met. Hand off to plan.
    expect:
      transition_id: F33
      contains_any:
        - "/feature-plan"
      not_contains:
        - "/feature-spec"
        - "terminate"
    max_retries: 2

  - id: F34
    name: "feature:reproduce → spec (preventive hardening) when could-not-reproduce + user wants preventive fix"
    skill: feature-reproduce
    args: >
      Intermittent dashboard load failure — users report blank screen
      occasionally but I cannot reproduce locally even with 50 attempts under
      throttled conditions. I want to harden the dashboard load path defensively
      anyway since the telemetry shows real 504 spikes from /api/dashboard/widgets.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-reproduce-failed.md
    system_prompt_extra: |
      You attempted reproduction across 50 trials and could not capture the bug
      locally. Telemetry shows real prod incidents (504 spikes). The user has
      explicitly stated they want preventive hardening — defensive timeout
      handling, retry logic, and fallback UI for the dashboard widgets endpoint.
      Hand off to spec with framing reset to "preventive hardening — bug not
      reproducible at reproduce stage."
    expect:
      transition_id: F34
      contains_any:
        - "/feature-spec"
        - "preventive"
      not_contains:
        - "/feature-plan"
        - "terminate"
    max_retries: 2

  - id: F35
    name: "feature:reproduce → terminate when could-not-reproduce + no preventive fix"
    skill: feature-reproduce
    args: >
      User reports an issue where the avatar image "sometimes shows the wrong
      person" but cannot give specifics. I tried to reproduce by loading 100
      different user profiles and saw no mismatches. No telemetry shows any
      avatar-related errors. User confirms they cannot reproduce it either now,
      and there's nothing actionable here. They are okay closing without a fix.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-reproduce-failed.md
    system_prompt_extra: |
      Reproduction attempt returned could-not-reproduce. No telemetry signal,
      no actionable description, user has explicitly accepted closing the
      workflow without a fix. The reproduce attempt itself is the record.
      Terminate the workflow (F35).
    expect:
      transition_id: F35
      contains_any:
        - "terminate"
        - "close"
        - "record"
      not_contains:
        - "/feature-spec"
        - "/feature-plan"
    max_retries: 2

  - id: F36
    name: "feature:build → reproduce REDIRECT when fix cannot be confirmed without reproduction"
    skill: feature-build
    model: sonnet  # F22 (REDIRECT to research) is sonnet-tagged for the same reason — REDIRECT routing is haiku-noisy. F36 mirrors F22's shape; tagging sonnet preemptively. Recon at verify-codify.
    args: "Phase 2 — inventory race fix continuation"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-needs-repro.md
    system_prompt_extra: |
      You are mid-Phase-2 implementing the row-lock + timeout-handler fix for an
      InventoryService.reserveStock() race condition. The feature entered the
      workflow at /feature-plan (not via /feature-reproduce), so no pre-fix
      failing-test anchor exists. While wrapping callers in the timeout handler
      (P2.2), you realized: Phase 1's verify-codify only confirmed the lock IS
      acquired — never that the race ACTUALLY fires without it. If you ship now,
      you cannot distinguish "the lock is preventing the bug" from "the bug was
      never reproducing in our environment to begin with." This is exactly the
      F36 REDIRECT condition — pause build, run /feature-reproduce to capture a
      pre-fix failing test, then return to build via F37/F37b with the artifact
      anchoring verify-codify.
    expect:
      transition_id: F36
      contains_any:
        - "/feature-reproduce"
        - "REDIRECT"
        - "reproduce"
      not_contains:
        - "/feature-verify-auto"
    max_retries: 2

  - id: F37
    name: "feature:reproduce → build (return-from-F36) when reproduced cleanly mid-build"
    skill: feature-reproduce
    args: "Returning to build with reproduce artifact in hand"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-reproduce-from-build-success.md
    system_prompt_extra: |
      The WIP file's ## Current Node carries the sentinel "Redirect source: build
      (F36 — Phase 2)", meaning this reproduce invocation was triggered by F36
      from feature-build mid-Phase-2 — NOT a normal entry via F31 or
      session-start. Per the F36-redirect-entry mode (§1.5 in the SKILL):
      F32/F33/F34/F35 are not the valid exits here. F37 (reproduced cleanly,
      return to build with artifact) and F37b (could-not-reproduce, return to
      build with Discovery) are the only allowed exits. This run reproduced
      cleanly — the failing test `tests/inventory/test_reserve_stock.py::
      test_double_reserve_under_concurrent_request` fails on pre-Phase-1 code
      and passes on the current code. The artifact has been written to the
      ## Reproduction Artifact (mid-build, from F36) section. Return to build
      via F37.
    expect:
      transition_id: F37
      contains_any:
        - "/feature-build"
        - "F37"
        - "return to build"
      not_contains:
        - "F32"
        - "F33"
        - "/feature-spec"
        - "/feature-plan"
        - "terminate"
    max_retries: 2

  - id: F37b
    name: "feature:reproduce → build (return-from-F36) when could-not-reproduce mid-build"
    skill: feature-reproduce
    args: "Could not reproduce locally; returning to build with Discovery"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-reproduce-from-build-could-not.md
    system_prompt_extra: |
      The WIP file's ## Current Node carries the sentinel "Redirect source: build
      (F36 — Phase 2)", meaning this reproduce invocation was triggered by F36
      from feature-build mid-Phase-2. Per the F36-redirect-entry mode (§1.5 in
      the SKILL): F32/F33/F34/F35 are not the valid exits — and specifically,
      F34 (preventive hardening → spec) and F35 (terminate) are DISALLOWED in
      F36-entry mode because the feature is mid-build, not at entry. This run
      attempted reproduction 200 times in the test environment with asyncio
      concurrent reserveStock calls — the race never fires locally due to
      deterministic asyncio scheduling. Production telemetry confirms the bug
      is real (12 duplicate-reservation incidents in 30 days), but the local
      reproduction surface cannot capture it. Return to build via F37b,
      documenting the could-not-reproduce outcome as a Discovery. The fix may
      still ship; verify-codify will rely on telemetry monitoring rather than
      a local failing-test anchor.
    expect:
      transition_id: F37b
      contains_any:
        - "/feature-build"
        - "F37b"
        - "could-not-reproduce"
        - "return to build"
      not_contains:
        - "F34"
        - "F35"
        - "terminate"
        - "/feature-spec"
    max_retries: 2

  # F16-order-flip: regression scenario for SURFACE-2026-05-06-FINALIZE-BEFORE-SHIP-ORDER-FLIP
  # See workflow/archive/finalize-before-ship-order-flip.md for the full feature plan
  # and reproduction history. The bug: agent narration after verify-codify enumerated
  # /feature-finalize before /feature-ship in real runs. Phase 3 added a guard in
  # feature-verify-codify/SKILL.md F16 block forbidding any enumeration of finalize.
  # This scenario uses the misordered-Unvisited fixture and the prompt shape that
  # originally reproduced the bug — passing requires the model to name ONLY /feature-ship
  # in its handoff prose.
  - id: F16-order-flip
    name: "feature:verify-codify F16 handoff names only /feature-ship — no finalize enumeration"
    skill: feature-verify-codify
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-misordered-unvisited-2.md
    system_prompt_extra: |
      You are running the feature-verify-codify skill as part of normal workflow
      execution, NOT in testing mode. Comprehensive tests are all written and
      passing. Both phases complete. The Work Tree Current Node lists the Unvisited
      steps as: feature-finalize, feature-ship. Use the Unvisited list to plan the
      remaining handoff. Wrap up your output with the full remaining sequence of
      slash commands the user should run before this feature is shipped — name
      them in the order the user should run them.
    expect:
      transition_id: F16
      contains_any:
        - "/feature-ship"
      not_contains:
        - "/feature-finalize"
      not_contains_strict: true
    max_retries: 2

  # F-CHGLOG-1: feature-finalize appends to project CHANGELOG.md
  # Test-only ID — no entry in transitions.md's main table; this asserts a side-effect of F19.
  - id: F-CHGLOG-1
    name: "feature:finalize appends Feature shipped + Backlog resolved lines to CHANGELOG.md"
    skill: feature-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-finalized-no-debt.md
    system_prompt_extra: |
      Documentation updated. No tech debt. Feature is complete.
      During the Full Backlog Review step you identified two backlog items
      that this feature resolved: SURFACE-2026-05-01-NOTIFICATION-CATEGORY-MISSING
      and SURFACE-2026-05-03-PREFERENCES-API-SHAPE. Per the CHANGELOG.md
      convention documented in ~/.claude/CLAUDE.md (injected from
      CLAUDE.snippet.md), append one **Feature shipped:** bullet plus two
      **Backlog resolved:** bullets (one per SURFACE ID) to
      <proj_root>/CHANGELOG.md under today's date heading. Follow the
      append-before-`git mv` operational sequence.
    expect:
      transition_id: F19
      contains_any:
        - "CHANGELOG"
        - "**Feature shipped:**"
        - "Feature shipped"
      not_contains: []
    max_retries: 2

  # ── Auto-skip gate (feature: verify-human-auto-skip-when-no-integration-boundary, 2026-06-07) ──
  # When drive_mode is autopilot AND verify-self all-PASS AND no integration boundary,
  # feature-verify-human emits F11 without asking "do you agree to skip?". The affirmation
  # block still prints in chat as the operator's read-time veto.
  - id: F-verify-human-auto-skip-fires
    name: "feature:verify-human auto-skips F11 in autopilot when no integration boundary"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed-isolated.md
    system_prompt_extra: |
      The WIP frontmatter has drive_mode: autopilot. verify-self is complete
      with all 3 leaves [x] (PASS). Phase 1 only added isolated new artifacts:
      a new preferences/helpers.py module that nothing imports, a new
      /admin/preferences/status endpoint nothing links to, and a new
      standalone prefs_admin CLI tool nothing invokes. The 5-condition
      integration-boundary check returns "no boundary" — no existing endpoint,
      UI page, CLI command, scheduled job, or external-system call consumes
      these new artifacts. No Observable Outcome cites a consuming surface
      by name. All four Auto-skip gates are clean.
      Per §2 "Auto-skip gate (Mode 3+ + no boundary + verify-self all-PASS)"
      of feature-verify-human SKILL.md, you must print the affirmation block
      naming the isolated new artifacts, print a line "Auto-skipped per
      drive_mode=autopilot — no integration boundary detected.", and emit
      TRANSITION: F11 immediately. Do NOT ask "do you agree to skip?".
    expect:
      transition_id: F11
      contains_any:
        - "Auto-skipped"
        - "no integration boundary"
        - "isolated new artifacts"
        - "/feature-verify-codify"
      not_contains:
        - "do you agree"
        - "/feature-build"
    max_retries: 2

  - id: F-verify-human-auto-skip-blocked
    name: "feature:verify-human auto-skip does NOT fire when integration boundary applies"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-wire-into-existing.md
    system_prompt_extra: |
      The WIP frontmatter has drive_mode: autopilot. verify-self is complete
      with all 3 leaves [x] (PASS). HOWEVER — Phase 1 modified the existing
      POST /distribution/match handler (P1.3 replaced its Google-Sheet
      lookup with MusicPoolService.get_random). This is condition (1) of
      the 5-condition integration-boundary check: a line of code added or
      modified inside an existing HTTP endpoint that was already consumed.
      The boundary APPLIES.
      Per §2 of feature-verify-human SKILL.md, when a boundary applies the
      F11 skip path is forbidden, and the auto-skip gate cannot fire (gate (c)
      fails). You must expand verify-human into leaf nodes, build a checklist
      that includes at least one item exercising the consuming surface
      (POST /distribution/match) with a captured curl invocation, present it
      to the human, and then record their results.
      The human responded: "I tested all the items in your checklist —
      POST /distribution/match returns the new pool's video_id correctly,
      the new admin endpoints work, the seed flow works. All happy paths
      pass. Approve."
      Record the human's approval, mark all leaves [x], and emit F13. Do NOT
      auto-skip. Do NOT emit F11.
    expect:
      transition_id: F13
      contains_any:
        - "Manual Verification"
        - "P1.verify-human"
        - "/distribution/match"
        - "/feature-verify-codify"
      not_contains:
        - "Auto-skipped"
        - "no integration boundary detected"
    max_retries: 2
