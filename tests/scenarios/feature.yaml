group: feature
scenarios:
  # F1 and F2 are ENTRY routing — tested via session-start in session.yaml.
  # We also test them explicitly here by invoking the skills directly.

  - id: F1
    name: "feature:spec entered for complex feature"
    skill: feature-spec
    args: >
      Build a real-time collaborative editing system with conflict resolution,
      presence indicators, offline sync, and multi-cursor support.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: F1
      contains_any:
        - "spec"
        - "specification"
      not_contains: []
    max_retries: 2

  - id: F3
    name: "feature:spec → research when unknowns exist"
    skill: feature-spec
    args: "Real-time collaboration feature"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-unknowns.md
    system_prompt_extra: |
      The spec has multiple open questions: which real-time protocol
      (WebSocket vs SSE vs WebTransport), how to handle conflict resolution
      (OT vs CRDT), and acceptable latency for presence. These must be
      researched before planning.
    expect:
      transition_id: F3
      contains_any:
        - "/feature-research"
      not_contains:
        - "/feature-plan"
    max_retries: 2

  - id: F4
    name: "feature:spec → plan when spec is clear"
    skill: feature-spec
    model: sonnet  # Haiku flakes on this scenario; sonnet is reliable. See workflow/backlog.md history (HIDDEN-FAIL-F4 → recon 2026-05-06).
    args: "User notification preferences"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-clear.md
    system_prompt_extra: |
      The specification is complete. No open questions. All acceptance
      criteria are clear. No unknowns to research.
    expect:
      transition_id: F4
      contains_any:
        - "/feature-plan"
      not_contains:
        - "/feature-research"
    max_retries: 2

  - id: F5
    name: "feature:research → plan when research complete"
    skill: feature-research
    args: "WebSocket vs SSE for real-time collaboration"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-unknowns.md
    system_prompt_extra: |
      Research is complete. Findings: WebSocket is the right choice for
      bidirectional real-time editing. CRDT (Yjs library) handles conflict
      resolution. 100ms latency is acceptable for presence. All questions
      answered. The spec remains valid.
    expect:
      transition_id: F5
      contains_any:
        - "/feature-plan"
      not_contains:
        - "/feature-spec"
    max_retries: 2

  - id: F6
    name: "feature:research back-loops to spec when spec is wrong"
    skill: feature-research
    args: "WebSocket vs SSE for real-time collaboration"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-unknowns.md
    system_prompt_extra: |
      Research reveals a critical problem: the spec assumed we could use a
      simple WebSocket server, but the existing infrastructure is behind a
      load balancer that doesn't support sticky sessions. The spec needs to
      be revised to account for a pub/sub architecture instead of direct
      WebSocket connections.
    expect:
      transition_id: F6
      contains_any:
        - "/feature-spec"
        - "back-loop"
        - "spec"
      not_contains:
        - "/feature-plan"
    max_retries: 2

  - id: F7
    name: "feature:plan → build (phase 1)"
    skill: feature-plan
    args: "User notification preferences"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-spec-clear.md
    expect:
      transition_id: F7
      contains_any:
        - "/feature-build"
      not_contains:
        - "/feature-ship"
    max_retries: 2

  - id: F8
    name: "feature:build → verify-auto when phase complete"
    skill: feature-build
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-phase1.md
    system_prompt_extra: |
      All Phase 1 steps are complete: notification_preferences table created,
      CRUD endpoints implemented, default preferences added on user creation.
      All code changes are done for this phase.
    expect:
      transition_id: F8
      contains_any:
        - "/feature-verify-auto"
      not_contains:
        - "/feature-plan"
        - "/feature-ship"
    max_retries: 2

  - id: F9
    name: "feature:verify-auto back-loops to build when tests fail"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      Test results: 20 tests passed, 3 FAILED.
      - test_create_preferences: AssertionError expected 201 got 400
      - test_update_preferences: KeyError 'email_enabled'
      - test_default_preferences: AssertionError missing default for 'sms'
      These are code bugs in the implementation, not spec problems.
    expect:
      transition_id: F9
      contains_any:
        - "/feature-build"
      not_contains:
        - "/feature-verify-human"
        - "/feature-spec"
    max_retries: 2

  - id: F10
    name: "feature:verify-auto → verify-self when tests pass"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      Test results: 24 tests passed, 0 failed. Linting clean. Type
      checking clean. All automated checks pass.
    expect:
      transition_id: F10
      contains_any:
        - "/feature-verify-self"
      not_contains:
        - "/feature-verify-human"
        - "/feature-build"
        - "/feature-spec"
    max_retries: 2

  - id: F13-prefiltered
    name: "feature:verify-human excludes verify-self [x] items from checklist"
    skill: feature-verify-human
    model: sonnet  # Haiku flakes: no structured TRANSITION line; sonnet is reliable (PASS strictly 2026-06-09). See backlog SURFACE-2026-05-13-VERIFY-CODIFY-SCENARIOS-NEED-SONNET-TAG (recon 2026-06-09).
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      verify-self completed with all outcomes [x] (PASS):
      - P1.verify-self.1 GET /api/notification-preferences → 200: PASS [x]
      - P1.verify-self.2 PUT /api/notification-preferences/:category → 200: PASS [x]
      - P1.verify-self.3 Browser /settings/notifications no JS errors: PASS [x]
      The human checklist must NOT include any of these items — they were
      already confirmed by the agent. The human should only see items that
      require genuine human judgment. Human approves the phase.
    expect:
      transition_id: F13
      contains_any:
        - "/feature-verify-codify"
      not_contains:
        - "P1.verify-self.1"
        - "P1.verify-self.2"
        - "P1.verify-self.3"
        - "GET /api/notification-preferences"
    max_retries: 2

  - id: F8-reverify
    name: "feature:build re-verify gate confirms fix before transitioning to verify-auto"
    skill: feature-build
    args: "P1.verify-self.1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-blocking.md
    system_prompt_extra: |
      Re-entering build from a verify-self back-loop (F9b). The previously
      failing outcome was: GET /api/notification-preferences → 500 (missing
      DB migration). You have applied the fix (ran the migration). Before
      transitioning to verify-auto, re-run the behavioral check:
      curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/notification-preferences
      returns 200. The re-verify passes. Now transition to verify-auto.
    expect:
      transition_id: F8
      contains_any:
        - "/feature-verify-auto"
        - "re-verify"
        - "confirmed"
        - "passes"
      not_contains:
        - "/feature-verify-human"
        - "/feature-plan"
    max_retries: 2

  - id: F10-clarified
    name: "feature:verify-auto recommends cheap/scoped checks, not full test suite"
    skill: feature-verify-auto
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      The build step just created a new Python module: notification_preferences.py.
      Run appropriate cheap, fast, scoped checks for this specific file only.
      Do NOT run the full pytest suite. Appropriate checks include: syntax check,
      lint, and an import smoke test (e.g. python -c "from notification_preferences
      import NotificationPreferences"). All checks pass.
    expect:
      transition_id: F10
      contains_any:
        - "/feature-verify-self"
        - "syntax"
        - "lint"
        - "import"
        - "smoke"
      not_contains:
        - "full test suite"
        - "run all tests"
        - "pytest -v"
    max_retries: 2

  - id: F9b
    name: "feature:verify-self back-loops to build on BLOCKING failure"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-blocking.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/notification-preferences → 200
      status: FAIL
      severity: BLOCKING
      detail: Returns 500 Internal Server Error — missing DB migration
      ---
      outcome: PUT /api/notification-preferences/:category → 200
      status: FAIL
      severity: BLOCKING
      detail: BLOCKED — cannot test because GET endpoint is broken
      ---
      outcome: Browser /settings/notifications no JS console errors
      status: FAIL
      severity: COSMETIC
      detail: Minor spacing misalignment on toggle row, no JS errors
      ```

      There is one BLOCKING failure. The agent must back-loop to build.
    expect:
      transition_id: F9b
      contains_any:
        - "/feature-build"
        - "BLOCKING"
        - "back-loop"
      not_contains:
        - "/feature-verify-human"
    max_retries: 2

  - id: F9b-rerun
    name: "feature:verify-self cosmetic-only failure does NOT back-loop — forwards to verify-human"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/notification-preferences → 200
      status: PASS
      severity: N/A
      detail: Returns 200 with correct body
      ---
      outcome: PUT /api/notification-preferences/:category → 200
      status: PASS
      severity: N/A
      detail: Persisted correctly on re-fetch
      ---
      outcome: Browser /settings/notifications no JS errors
      status: FAIL
      severity: COSMETIC
      detail: Toggle labels have slightly inconsistent padding (no JS errors, no crash)
      ```

      One COSMETIC failure exists. COSMETIC failures do NOT trigger a back-loop.
      Forward to verify-human and note the cosmetic item.
    expect:
      transition_id: F10b
      contains_any:
        - "/feature-verify-human"
        - "cosmetic"
        - "COSMETIC"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F10b
    name: "feature:verify-self → verify-human when all blocking outcomes pass"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/notification-preferences → 200
      status: PASS
      severity: N/A
      detail: Returns 200 with body [{category: "email", enabled: true}]
      ---
      outcome: PUT /api/notification-preferences/email with {"enabled": false} → 200
      status: PASS
      severity: N/A
      detail: Re-fetch returns enabled: false — persisted correctly
      ---
      outcome: Browser /settings/notifications no JS console errors
      status: PASS
      severity: N/A
      detail: Page loads cleanly, no console errors
      ```

      All blocking outcomes pass. No cosmetic issues. Forward to verify-human.
    expect:
      transition_id: F10b
      contains_any:
        - "/feature-verify-human"
      not_contains:
        - "/feature-build"
    max_retries: 2

  # Tests the "In-place fix shortcut" sub-clause in feature-verify-self/SKILL.md §3.
  # When a BLOCKING failure is a trivial extension of the just-completed leaf
  # AND a fresh subagent re-verifies the fix, the agent may apply the fix in-place
  # and emit F10b (forward to verify-human) with an audit-trail entry — instead of
  # F9b (back-loop to build). All three gates hold in the fixture and prompt:
  # (a) trivial fix, (b) fresh subagent re-verifies, (c) audit-trail in Discoveries.
  - id: F10b-shortcut
    name: "feature:verify-self applies in-place fix shortcut on trivial BLOCKING fail with fresh re-verification"
    skill: feature-verify-self
    args: "http://localhost:3000"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-trivial-fix.md
    system_prompt_extra: |
      SUBAGENT RESULTS ALREADY RECEIVED. Do not attempt to connect to the app.
      The verification subagent has already run and returned these results:

      ```result
      outcome: GET /api/user/theme → 200, body contains {"theme": "light"|"dark"}
      status: FAIL
      severity: BLOCKING
      detail: Returns 200 but body is {"theme": null}. The migration written
              moments ago in P1.1 added the column without a DEFAULT clause —
              a one-character SQL fix to the migration just written.
      ---
      outcome: PUT /api/user/theme with {"theme": "dark"} → 200
      status: PASS
      severity: N/A
      detail: Persists correctly when value is explicitly provided.
      ```

      The §3 "In-place fix shortcut" sub-clause applies. All three gates hold:
      (a) the fix is a trivial extension of the just-completed leaf P1.1 — adding
          DEFAULT 'light' to the migration the agent itself just wrote (one
          character / one keyword);
      (b) re-verification will run through a fresh Playwright subagent against
          the same Observable Outcome (identical artifact to what F9b → verify-self
          would produce);
      (c) the agent will append an audit-trail entry
          `[SHORTCUT-2026-06-09] P1.verify-self.1 — added DEFAULT 'light' to
          migration; re-verified via fresh subagent` to ## Discoveries.

      Apply the fix in-place, re-verify per gate 2, mark the leaf [x], append
      the ## Discoveries entry, and proceed to F10b (forward to verify-human) —
      NOT F9b (back-loop to build).
    expect:
      transition_id: F10b
      contains_any:
        - "/feature-verify-human"
        - "SHORTCUT"
        - "shortcut"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F11
    name: "feature:verify-human skips to verify-codify with reasoning"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-auto-passed.md
    system_prompt_extra: |
      Phase 1 is purely backend API work — database table and REST
      endpoints. There is no UI, no user-facing interface to manually
      test. Full automated test coverage exists for all endpoints.
      The human confirms there is nothing to manually test.
    expect:
      transition_id: F11
      contains_any:
        - "/feature-verify-codify"
        - "nothing to manually test"
        - "skip"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F12
    name: "feature:verify-human back-loops to build when human rejects"
    skill: feature-verify-human
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-auto-passed.md
    system_prompt_extra: |
      The human tested the API endpoints and found issues:
      - The PATCH endpoint doesn't validate that category names exist
      - The GET endpoint returns 200 with empty body instead of 404 for
        non-existent users
      - The response format doesn't match the documented API contract
      Human rejects this phase.
    expect:
      transition_id: F12
      contains_any:
        - "/feature-build"
        - "back-loop"
      not_contains:
        - "/feature-verify-codify"
        - "/feature-ship"
    max_retries: 2

  - id: F13
    name: "feature:verify-human → verify-codify when approved"
    skill: feature-verify-human
    model: sonnet  # Haiku flakes: output-shape issues (missing TRANSITION line / prose-leak); sonnet is reliable (PASS strictly 2026-06-09). See backlog SURFACE-2026-05-13-VERIFY-CODIFY-SCENARIOS-NEED-SONNET-TAG (recon 2026-06-09).
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-auto-passed.md
    system_prompt_extra: |
      The human verified the API endpoints:
      - GET /preferences returns correct defaults for new users
      - PATCH /preferences updates correctly
      - Invalid category returns 400
      All happy paths work. Human approves.
    expect:
      transition_id: F13
      contains_any:
        - "/feature-verify-codify"
      not_contains:
        - "/feature-build"
    max_retries: 2

  - id: F14
    name: "feature:verify-codify back-loops when tests reveal issues"
    skill: feature-verify-codify
    model: sonnet  # Haiku flakes: output-shape issues (missing TRANSITION line / prose-leak); sonnet is reliable (PASS strictly 2026-06-09). See backlog SURFACE-2026-05-13-VERIFY-CODIFY-SCENARIOS-NEED-SONNET-TAG (recon 2026-06-09).
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-human-approved.md
    system_prompt_extra: |
      While writing comprehensive tests, you discovered that concurrent
      PATCH requests to the same user's preferences cause a race condition.
      The human didn't catch this because they tested sequentially. This
      is a real bug that the human should verify the fix for.
    expect:
      transition_id: F14
      contains_any:
        - "/feature-verify-human"
        - "back-loop"
      not_contains:
        - "/feature-build"
        - "/feature-ship"
    max_retries: 2

  - id: F15
    name: "feature:verify-codify → build (next phase) when more phases"
    skill: feature-verify-codify
    model: sonnet  # Haiku flakes: output-shape issues (missing TRANSITION line / prose-leak); sonnet is reliable (PASS strictly 2026-06-09). See backlog SURFACE-2026-05-13-VERIFY-CODIFY-SCENARIOS-NEED-SONNET-TAG (recon 2026-06-09).
    args: "phase 1"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-human-approved.md
    system_prompt_extra: |
      Comprehensive tests written and all pass. Phase 1 (Backend API) is
      fully verified. Phase 2 (Frontend Settings UI) still remains.
    expect:
      transition_id: F15
      contains_any:
        - "/feature-build"
        - "phase 2"
        - "next phase"
      not_contains:
        - "/feature-ship"
    max_retries: 2

  - id: F16
    name: "feature:verify-codify → ship when all phases done"
    skill: feature-verify-codify
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      All comprehensive tests written and passing. Both Phase 1 and Phase 2
      are fully verified. No more phases remain. Feature is ready to ship.
    expect:
      transition_id: F16
      contains_any:
        - "/feature-ship"
      not_contains:
        - "/feature-build"
    max_retries: 2

  # PP4: verify-codify triage gate scenarios
  - id: F16-triage-regression
    name: "feature:verify-codify auto-fixes high-confidence code regression"
    skill: feature-verify-codify
    model: sonnet  # Haiku flakes: prose-leak family (output-shape issues); sonnet is reliable (PASS strictly 2026-06-09). See backlog SURFACE-2026-05-13-VERIFY-CODIFY-SCENARIOS-NEED-SONNET-TAG (recon 2026-06-09).
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      While running the full test suite, one test fails:
        FAILED tests/test_preferences.py::test_default_preferences_on_user_create
        AssertionError: expected 3 defaults, got 0
      You inspect the new code and find that the P1.3 implementation
      (add default preferences on user creation) has a bug: the
      `create_user` function in user_service.py line 47 calls
      `db.add(user)` but never calls `_seed_default_preferences(user.id)`.
      This is an obvious code regression — the test is correct, the new
      code broke it, and the specific missing call is unambiguous.
      High confidence. Classify as code regression, write the triage
      artifact to the WIP file, auto-fix the code, and proceed.
    expect:
      transition_id: F16
      contains_any:
        - "Code regression"
        - "code regression"
        - "regression"
        - "triage"
        - "Triage"
      not_contains:
        - "pause"
        - "human"
        - "obsolete"
    max_retries: 2

  - id: F16-triage-ambiguous
    name: "feature:verify-codify pauses on ambiguous failure"
    skill: feature-verify-codify
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      While running the full test suite, one test fails:
        FAILED tests/test_preferences.py::test_email_notification_default_enabled
        AssertionError: expected enabled=True, got enabled=False
      The new feature changes the default notification state as part of
      a new "conservative defaults" policy. It's unclear whether this
      test was checking the old default (now intentionally changed) or
      a business invariant that must be preserved. Both the test and the
      new feature could be correct. You cannot determine from the code
      alone whether the old behavior was intentionally superseded.
      This is ambiguous — you cannot determine high confidence for any
      single classification. Write the triage artifact and pause for human.
    expect:
      transition_id: F16
      contains_any:
        - "pause"
        - "human"
        - "ambiguous"
        - "unclear"
        - "triage"
        - "Triage"
      not_contains:
        - "auto-fix"
        - "automatically fixed"
        - "/feature-ship"
    max_retries: 2

  - id: F16-triage-flaky
    name: "feature:verify-codify classifies inconsistent test as flaky"
    skill: feature-verify-codify
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      While running the full test suite, one test fails:
        FAILED tests/test_preferences.py::test_concurrent_preference_updates
        AssertionError: expected 2 updates, got 1
      You re-run the test suite. This time the same test passes.
      You run it a third time — it fails again. The failure is
      inconsistent across runs (passes and fails non-deterministically).
      The new code does not touch the concurrency logic. This is a
      pre-existing flaky test unrelated to the feature changes.
      Classify as flaky, write the triage artifact, and pause for human.
      Do NOT modify any code or test files.
    expect:
      transition_id: F16
      contains_any:
        - "flaky"
        - "flake"
        - "inconsistent"
        - "non-deterministic"
        - "triage"
        - "Triage"
      not_contains:
        - "auto-fix"
        - "automatically fixed"
        - "modified"
        - "/feature-ship"
    max_retries: 2

  - id: F16-triage-contract
    name: "feature:verify-codify always pauses on contract conflict"
    skill: feature-verify-codify
    args: "phase 2"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-codify-all-phases-done.md
    system_prompt_extra: |
      While running the full test suite, one test fails:
        FAILED tests/test_preferences.py::test_admin_cannot_override_user_preference
        AssertionError: admin override succeeded, expected 403
      The new feature intentionally adds admin override capability as an
      explicit product requirement. The test was written to guard the
      old invariant that admins cannot override user preferences. Both
      the test (old invariant) and the new feature (new capability) are
      internally correct — they represent conflicting product contracts.
      This is a contract conflict. Even if you were highly confident,
      this classification always requires human approval. Write the
      triage artifact and pause for human, regardless of confidence.
    expect:
      transition_id: F16
      contains_any:
        - "contract"
        - "conflict"
