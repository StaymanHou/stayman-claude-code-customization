group: session
scenarios:
  - id: S1
    name: "session:start routes bug fix to task workflow"
    skill: session-start
    args: "Fix the off-by-one error in the pagination component"
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S1
      contains_any:
        - "/task-plan"
        - "task"
      not_contains:
        - "/feature-spec"
        - "/product-vision"
        - "/incident-report"
    max_retries: 2

  - id: S2
    name: "session:start routes complex feature to feature:spec"
    skill: session-start
    args: >
      Build a real-time collaborative editing system with conflict
      resolution, presence indicators, offline sync, and multi-cursor
      support. Needs new WebSocket infrastructure, CRDT implementation,
      and UI components for presence and cursors.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S2
      contains_any:
        - "/feature-spec"
      not_contains:
        - "/task-plan"
        - "/feature-plan"
    max_retries: 2

  - id: S3
    name: "session:start routes simple feature to feature:plan"
    skill: session-start
    model: sonnet  # Even after Valid-transitions section in SKILL.md, haiku FLAKY/FAILs on routing classification. Sonnet FLAKY-passes (run-2026-05-06-122811). Tagged 2026-05-06.
    args: "Add a tooltip to the settings icon showing the keyboard shortcut Ctrl+K"
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S3
      contains_any:
        - "/feature-plan"
      not_contains:
        - "/feature-spec"
        - "/product-vision"
    max_retries: 2

  - id: S4
    name: "session:start routes incident to incident:report"
    skill: session-start
    args: "Production is down! Users getting 500 errors on the main API"
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S4
      contains_any:
        - "/incident-report"
        - "incident"
      not_contains:
        - "/task-plan"
        - "/feature-spec"
    max_retries: 2

  - id: S5
    name: "session:start routes product initiative to product:vision"
    skill: session-start
    args: >
      I want to build a completely new product — an AI-powered code
      review tool that integrates with GitHub. Need to plan the whole
      thing from vision to architecture to implementation.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S5
      contains_any:
        - "/product-vision"
        - "product"
      not_contains:
        - "/feature-spec"
        - "/task-plan"
    max_retries: 2

  # PP5: Orchestrator AUTO/PAUSE policy scenarios
  # These test that session-start reads the pause policy from AGENTS.md correctly.

  - id: S7
    name: "session:orchestrator auto-chains build→verify-auto without asking user"
    skill: session-start
    args: "Continue the notification preferences feature — Phase 1 build is complete, run verification"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      You are driving the feature workflow end-to-end (orchestrated mode).
      The user has confirmed they want end-to-end driving.
      Phase 1 build is complete (Current Node: verify-auto).
      Per the AUTO/PAUSE policy in agents/feature-workflow/AGENTS.md:
      feature-build is AUTO — the orchestrator must chain immediately to
      feature-verify-auto without asking the user to type "/feature-verify-auto".
      Demonstrate that you will invoke verify-auto automatically, not prompt
      the user to run it manually.
    expect:
      transition_id: S7
      contains_any:
        - "auto"
        - "automatically"
        - "chain"
        - "immediately"
        - "verify-auto"
      not_contains:
        - "run /feature-verify-auto"
        - "type /feature-verify-auto"
        - "please run"
    max_retries: 2

  - id: S8
    name: "session:orchestrator pauses at verify-human (PAUSE step)"
    skill: session-start
    args: "Continue the notification preferences feature — verify-auto and verify-self passed, ready for human review"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      You are driving the feature workflow end-to-end (orchestrated mode).
      The user has confirmed they want end-to-end driving.
      verify-auto and verify-self both passed.
      Per the AUTO/PAUSE policy in agents/feature-workflow/AGENTS.md:
      feature-verify-human is PAUSE — the orchestrator must stop and wait
      for the human to review the running feature. It must NOT auto-chain
      past verify-human. Invoke notify-human and present the checklist.
    expect:
      transition_id: S8
      contains_any:
        - "verify-human"
        - "review"
        - "check"
        - "manually"
      not_contains:
        - "auto-chain"
        - "/feature-verify-codify"
    max_retries: 2

  - id: S9
    name: "session:orchestrator pauses at feature-finalize (PAUSE step)"
    skill: session-start
    args: "Continue — feature has shipped, now finalize"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-shipped.md
    system_prompt_extra: |
      You are driving the feature workflow end-to-end (orchestrated mode).
      The user has confirmed they want end-to-end driving.
      feature-ship completed (F38 → review-quality); review-quality reported clean
      with no findings and emitted F39 — review-quality → finalize.
      Per the AUTO/PAUSE policy in agents/feature-workflow/AGENTS.md:
      feature-finalize is PAUSE — the orchestrator must stop after finalize
      completes and wait for the human to confirm cycle close and backlog review.
      It must NOT auto-chain past finalize into a new workflow.
    expect:
      # Dual-identity: orchestrator at finalize step is genuinely transitioning into
      # F19 (finalize → EXIT/reflect), so emitting F19 is honest. Accept either.
      transition_id_any: [S9, F19]
      contains_any:
        - "finalize"
        - "backlog"
        - "review"
        - "confirm"
        - "done"
      not_contains:
        - "/session-start"
        - "next feature"
        - "auto-chain"
    max_retries: 2

  # Drive mode scenarios (S10–S12)
  # S10: regression test — reproduces the original bug with NO coaching.
  #   Before implementation: session-start stops after plan (emits "Run /feature-build").
  #   After implementation: session-start shows a drive-mode selection prompt instead.
  # S11/S12: implementation verification tests for fsd and autopilot modes.
  #   These use system_prompt_extra to simulate having drive mode already selected,
  #   and verify the chaining/pause behavior matches the spec.

  - id: S10
    name: "session:start regression — stops after plan when user says 'drive it end-to-end' (no drive-mode prompt)"
    skill: session-start
    args: "WP3 Input + Camera — drive it end-to-end, no stops"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-complete.md
    expect:
      # Routing-vs-drive-mode dual identity: model classifies the request as
      # routing first (S3 = small/simple → feature-plan), then notices the
      # "drive it end-to-end" signal and presents the drive-mode menu. Both
      # are honest emissions when the menu is actually shown.
      transition_id_any: [S10, S3]
      contains_any:
        - "Stepping"
        - "Orchestrated"
        - "Autopilot"
        - "FSD"
        - "drive mode"
        - "mode 1"
        - "mode 2"
        - "mode 3"
        - "mode 4"
      not_contains:
        - "Run /feature-build"
        - "run /feature-build"
    max_retries: 2

  - id: S11
    name: "session:fsd (mode 4) chains past plan into build without pausing"
    skill: session-start
    args: "WP3 Input + Camera"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-plan-complete.md
    system_prompt_extra: |
      The user has selected drive mode 4 (FSD).
      In fsd mode, ALL steps are AUTO — the orchestrator must NOT pause
      after feature-plan. It must immediately chain to feature-build (F7 transition)
      without asking the user to type "/feature-build" or confirm anything.
      The "Single-step mode only: STOP" directive in feature-plan/SKILL.md does NOT
      apply in fsd mode — it is a direct-invocation instruction only.
      Demonstrate that you chain to build automatically.
    expect:
      # Dual-identity: orchestrator chaining plan→build is genuinely emitting
      # F7 (plan → build) or F8 (build → verify-auto, depending on phase reached).
      transition_id_any: [S11, F7, F8]
      contains_any:
        - "feature-build"
        - "build"
        - "implement"
        - "chaining"
        - "automatically"
      not_contains:
        - "Run /feature-build"
        - "run /feature-build"
        - "please run"
        - "Sound good?"
    max_retries: 2

  - id: S12
    name: "session:autopilot (mode 3) pauses at verify-human (only pause point)"
    skill: session-start
    args: "Continue notification preferences feature — verify-auto and verify-self passed"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      The user has selected drive mode 3 (Autopilot).
      verify-auto and verify-self both passed. The next step is verify-human.
      In autopilot mode, verify-human is the ONLY pause point — the orchestrator
      must stop here, invoke notify-human, and present the verification checklist.
      It must NOT auto-chain to verify-codify.
    expect:
      # Dual-identity: pausing AT verify-human is genuinely the F10b transition
      # (verify-self → verify-human). S12 labels the autopilot-mode decoration.
      transition_id_any: [S12, F10b]
      contains_any:
        - "verify-human"
        - "review"
        - "check"
        - "manually"
      # In autopilot mode, "auto-chain to verify-codify" or saying it happens
      # "automatically" is a real behavior bug. Flip to strict.
      not_contains:
        - "/feature-verify-codify"
        - "auto-chain"
        - "automatically"
      not_contains_strict: true
    max_retries: 2

  - id: S13
    name: "session:stepping (mode 1) pauses after every skill and tells user next slash command"
    skill: session-start
    args: "Continue notification preferences feature — Phase 1 build is complete"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      The user has selected drive mode 1 (Stepping).
      In stepping mode, the orchestrator pauses after EVERY skill — including
      AUTO steps like feature-build. After feature-build completes, the orchestrator
      must NOT automatically invoke feature-verify-auto. Instead it must stop,
      summarise what was done, and tell the user which slash command to run next
      (e.g. "Run /feature-verify-auto to continue").
    expect:
      # Dual-identity: orchestrator pausing after build is genuinely at the
      # build → verify-auto transition (F8). Stepping pause is the
      # session-level decoration on top.
      transition_id_any: [S13, F8]
      contains_any:
        - "/feature-verify-auto"
        - "run /feature-verify-auto"
        - "next step"
        - "slash command"
      not_contains:
        - "automatically"
        - "chaining"
        - "auto-chain"
    max_retries: 2

  - id: S14
    name: "session:fsd (mode 4) skips verify-human and chains to verify-codify"
    skill: session-start
    args: "Continue notification preferences feature — verify-self passed, ready to codify"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-verify-self-passed.md
    system_prompt_extra: |
      The user has selected drive mode 4 (FSD).
      verify-self passed. In fsd mode, verify-human is SKIPPED entirely —
      the orchestrator must NOT invoke feature-verify-human or pause for human review.
      It must chain directly to feature-verify-codify using verify-self's result as
      the acceptance gate.
    expect:
      # Dual-identity: fsd skipping verify-human and chaining to
      # verify-codify is genuinely the F11/F13 transition (verify-human →
      # verify-codify, either skip or approve path). S14 is the session-level
      # label for the same emission.
      transition_id_any: [S14, F11, F13]
      contains_any:
        - "verify-codify"
        - "codify"
        - "skipping"
        - "skipped"
        - "skip"
      # S14 is one of the rare scenarios where presence of verify-human prose
      # is genuinely a behavior bug (fsd must skip it), so flip
      # not_contains to strict — content-mismatch should FAIL not SOFT_PASS.
      not_contains:
        - "verify-human"
        - "human review"
        - "manually review"
      not_contains_strict: true
    max_retries: 2

  - id: S6
    name: "session:resume deletes .session.md after restoring context"
    skill: session-restore
    args: ""
    fixtures:
      session: fixtures/session/feature-ship-paused.md
      wip: fixtures/wip/feature-ship-paused.md
    expect:
      transition_id: S6
      contains_any:
        - "delete"
        - "deleted"
        - "removed"
        - "rm "
        - "clean"
      not_contains:
        - "stays in place"
        - "will be overwritten"
    max_retries: 2

  - id: S15
    name: "session:resume surfaces drive_mode from .session.md and shows change-mode menu"
    skill: session-restore
    args: ""
    fixtures:
      session: fixtures/session/autopilot-paused.md
      wip: fixtures/wip/feature-build-phase1-done.md
    expect:
      transition_id: S15
      contains_any:
        - "autopilot"
        - "Autopilot"
        - "mode 3"
        - "Mode 3"
      not_contains:
        - "no drive mode"
        - "mode not set"
    max_retries: 2

  - id: S16
    name: "session:resume allows user to change drive mode on resume"
    skill: session-restore
    args: ""
    fixtures:
      session: fixtures/session/autopilot-paused.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      The session was paused in Autopilot mode (Mode 3).
      The user has now selected Mode 4 (FSD) from the change-mode menu.
      You must confirm the mode change to the user (e.g. "Switched to FSD mode")
      and update the drive_mode field in the WIP file frontmatter to "fsd".
      Do NOT just say "keeping Autopilot" — the user explicitly picked a different mode.
    expect:
      transition_id: S16
      contains_any:
        - "fsd"
        - "FSD"
        - "switched"
        - "Switched"
        - "changed"
        - "updated"
      not_contains:
        - "keeping autopilot"
        - "no change"
    max_retries: 2

  - id: S17
    name: "session:pause writes drive_mode from WIP frontmatter into .session.md"
    skill: session-handoff
    args: ""
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-autopilot-active.md
    system_prompt_extra: |
      The active WIP file (feature-autopilot-active.md) has drive_mode: autopilot in its
      YAML frontmatter. When writing workflow-system/state/.session.md, you must include the line
      drive_mode: autopilot in the frontmatter block. Demonstrate that you read the
      drive_mode from the WIP file and include it in the session pointer — do not omit it.
    expect:
      transition_id: S17
      contains_any:
        - "drive_mode: autopilot"
        - "drive_mode:autopilot"
        - "autopilot"
      not_contains:
        - "drive_mode not set"
        - "no drive mode"
    max_retries: 2

  # ── WP5 (M9) behavioral guard scenarios ──────────────────────────────────
  # These two encode the TWO confirmed live misfires of session-handoff as regression tests.
  # session-handoff carries the disambiguation table + agent-side guard: bare/turn-level "pause"
  # mid-work, and the going-offline family ("I'll /resume later"), are TURN-LEVEL — the skill must
  # NOT write .session.md and must NOT emit S17. Per docs/lessons/test-scenario-prompt-leakage.md,
  # the args present the operator's RAW words neutrally and do NOT recite the rule ("this is
  # turn-level, don't write .session.md") — else it tests obedience, not the guard. session-handoff
  # emits S17 only on a real handoff, so the pass signal is prose (SOFT_PASS via contains_any) that
  # the skill recognized turn-level intent + declined to write; not_contains guards the misfire.
  - id: S26-handoff-guard-turn-level-pause
    name: "session:handoff treats a bare mid-work 'pause' as turn-level — declines the handoff, writes no .session.md"
    skill: session-handoff
    args: >
      pause — hold on a sec, let me look at what you just changed before you keep going
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-autopilot-active.md
    expect:
      # Bare "pause" + "hold on … before you keep going" = turn-level interrupt mid-work. The guard
      # says: do NOT write .session.md, do NOT hand off; just stop / offer to confirm. Assert the
      # skill recognizes turn-level (prose) and does NOT claim to have written the handoff.
      contains_any:
        - "turn-level"
        - "just stop"
        - "won't write"
        - "not writing"
        - "Turn-level hold, or"
      not_contains:
        - "Handed off"
        - "wrote workflow-system/state/.session.md"
        - "TRANSITION: S17"
    max_retries: 2

  - id: S27-handoff-guard-going-offline-is-turn-level
    name: "session:handoff treats 'I need to go, I'll /resume later' as turn-level HOLD — not a cross-session handoff"
    skill: session-handoff
    args: >
      hold right there, I need to go — I'll /resume later
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-autopilot-active.md
    expect:
      # The going-offline family ("I need to go", "I'll /resume later") reads superficially like a
      # future-session cue but is TURN-LEVEL HOLD — /resume (built-in, continues THIS turn) ≠
      # /session-restore. The skill must stop immediately and NOT write .session.md. This is the
      # SECOND confirmed live misfire (2026-07-21). SOFT_PASS on turn-level RECOGNITION; not_contains
      # guards the false-positive handoff.
      #
      # NB (review-quality MAJOR, 2026-07-21): the positive tokens must NOT be input-echoable — the
      # args literally say "I'll /resume later", so a bare "/resume" alternative would SOFT_PASS on a
      # model that merely quotes the operator back ("you said you'll /resume later") without proving it
      # RECOGNIZED the going-offline family as turn-level. All tokens below are non-echoing: they only
      # appear if the model actually classified the intent as turn-level / declined the handoff.
      contains_any:
        - "turn-level"
        - "just stop"
        - "continue this turn"
        - "won't write"
        - "not writing"
      not_contains:
        - "Handed off"
        - "wrote workflow-system/state/.session.md"
        - "TRANSITION: S17"
    max_retries: 2

  - id: S18
    name: "session:start routes bug-shape feature to feature:reproduce"
    skill: session-start
    args: >
      The dashboard widget loading is broken — users intermittently see blank
      widgets, console errors about undefined fields, and the cache invalidation
      is misfiring across tabs. We've been getting reports for two weeks. This
      affects multiple components (widget renderer, cache layer, cross-tab sync)
      and we need to investigate root cause AND backfill regression coverage.
      Fix this regression.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id_any: [S18, S2]
      contains_any:
        - "/feature-reproduce"
        - "reproduce"
        - "red-green"
      not_contains:
        - "/task-plan"
        - "/incident-report"
        - "/product-vision"
    max_retries: 2

  - id: S21
    name: "session:orchestrator (mode 2) ignores skill-emitted 'Run /feature-X' prose and auto-chains"
    skill: session-start
    args: "Continue notification preferences feature"
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      You are orchestrating the feature workflow in **Orchestrated mode (Mode 2)**.
      The user already selected Mode 2 earlier in the session — do NOT re-present
      the drive-mode menu.

      The `feature-build` Skill just returned. Its output ended with:

          Phase 1 impl complete:
          - Migration applied, schema updated
          - Manual smoke check passes

          **Next:** Run `/feature-verify-auto` to verify Phase 1.

          TRANSITION: F8

      Per `skills/session-start/SKILL.md` step 4 and the Mode-2 pause policy in
      `agents/feature-workflow/AGENTS.md`:
      - `feature-build` is AUTO in Mode 2.
      - The orchestrator MUST NOT treat the skill's `"Run /feature-verify-auto"`
        prose as a stop signal — it is advisory text for single-step users only.
      - The only authoritative signal is `TRANSITION: F8`, which means "build →
        verify-auto, chain to it now."

      What do you do next? Demonstrate the correct orchestrator behavior:
      invoke `feature-verify-auto` immediately via the Skill tool (describe it,
      since you're not running it for real here) — do NOT stop, do NOT ask the
      user to confirm, do NOT echo "/feature-verify-auto" as a next-step for the
      user to type.
    expect:
      # Dual-identity, two layers deep: the orchestrator chaining build → verify-auto
      # is genuinely emitting F8. If the model has mentally chained through verify-auto
      # already, F10 (verify-auto pass) is also honest. S21 is the session-level
      # decoration. Any of these is acceptable — what matters is that the model is
      # narrating forward orchestration, not user-deferral (caught by not_contains).
      transition_id_any: [S21, F8, F10]
      contains_any:
        - "invoke"
        - "invoking"
        - "chaining"
        - "Skill"
        - "auto-chain"
        - "verify-self"
        - "verify-auto"
      # Strict: any of these phrases means the orchestrator stopped and asked
      # the user instead of chaining. That is the exact bug under reproduction.
      not_contains:
        - "let me know"
        - "ready to proceed"
        - "shall I"
        - "should I"
        - "type /feature-verify-auto"
        - "please run"
        - "you'll need to run"
        - "you need to run"
        - "you need to supply"
        - "waiting for"
        - "awaiting your"
        - "when prompted"
      not_contains_strict: true
    max_retries: 2

  - id: S24
    name: "session:orchestrator (mode 3 / autopilot) chains build → verify-auto, does not pause"
    skill: session-start
    # NOTE: args is intentionally a continuation signal, not a fresh classification
    # request. The system_prompt_extra below places the model at the post-build
    # decision point, NOT at session-start classification. This mirrors S21's
    # shape — see S21 for the precedent and SURFACE-2026-05-13-VERIFY-CODIFY-
    # SCENARIOS-NEED-SONNET-TAG for the haiku output-shape noise that affects
    # this scenario family (likely needs `model: sonnet` tag once the bug fix
    # itself is verified to PASS strictly on sonnet).
    args: "[mid-orchestration continuation — see system prompt]"
    # Regression gate for the 2026-05-16 incident:
    # incident-autopilot-pause-policy-recheck-regression.md.
    # S21 covers Mode 2 (Orchestrated) chaining. S24 covers Mode 3 (Autopilot) — the
    # default since 2026-05-14 — where the same failure shape recurred despite the
    # S21 fix because S21 only asserted Mode 2.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      You are orchestrating the feature workflow in **Autopilot mode (Mode 3)**.
      The user already selected Mode 3 earlier in the session — do NOT re-present
      the drive-mode menu. Mode 3's pause policy is: ONLY `verify-human` pauses;
      every other per-phase transition (build → verify-auto, verify-auto →
      verify-self, verify-self → verify-human PAUSE, verify-human → verify-codify,
      verify-codify → ship/finalize) is AUTO and must chain immediately.

      The `feature-build` Skill just returned. Its output ended with:

          Phase 1 impl complete:
          - Migration applied, schema updated
          - Manual smoke check passes

          **Next:** Run `/feature-verify-auto` to verify Phase 1.

          TRANSITION: F8

      Per `skills/session-start/SKILL.md` step 4 and the Mode-3 pause policy in
      `agents/feature-workflow/AGENTS.md`:
      - `feature-build` is AUTO in Mode 3 (only `verify-human` pauses).
      - The orchestrator MUST NOT treat the skill's `"Run /feature-verify-auto"`
        prose as a stop signal — it is advisory text for single-step users only.
      - The only authoritative signal is `TRANSITION: F8`, which means "build →
        verify-auto, chain to it now."
      - Anchoring on the mode chosen at session-start without re-checking per
        step is a known confabulation channel: a clean-feeling pause beat ≠ a
        policy-sanctioned pause.

      What do you do next? Demonstrate the correct orchestrator behavior:
      invoke `feature-verify-auto` immediately via the Skill tool (describe it,
      since you're not running it for real here) — do NOT stop, do NOT ask the
      user to confirm, do NOT echo "/feature-verify-auto" as a next-step for the
      user to type, do NOT wait for "continue" or any user signal.
    expect:
      # Same dual-identity rationale as S21: orchestrator chaining is genuinely
      # F8 at this node, F10 if the model has mentally chained through verify-auto.
      # S24 itself is the session-level decoration.
      transition_id_any: [S24, F8, F10]
      contains_any:
        - "invoke"
        - "invoking"
        - "chaining"
        - "Skill"
        - "auto-chain"
        - "verify-self"
        - "verify-auto"
      # Strict: any of these phrases means the orchestrator stopped and asked
      # the user instead of chaining. That is the exact bug under reproduction —
      # the live 2026-05-16 failure ended its turn with a "Phase 1 complete"
      # summary and TRANSITION: F8 token, with no follow-on Skill invocation.
      not_contains:
        - "let me know"
        - "ready to proceed"
        - "ready when you are"
        - "shall I"
        - "should I"
        - "type /feature-verify-auto"
        - "type 'continue'"
        - "type continue"
        - "please run"
        - "you'll need to run"
        - "you need to run"
        - "you need to supply"
        - "waiting for"
        - "awaiting your"
        - "when prompted"
        - "when you're ready"
      not_contains_strict: true
    max_retries: 2

  - id: S25
    name: "session:orchestrator (mode 3 / autopilot) chains verify-auto → verify-self, does not pause"
    skill: session-start
    args: "[mid-orchestration continuation — see system prompt]"
    # Companion to S24. The live 2026-05-16 session showed the failure recur at
    # the verify-auto → verify-self transition (the next AUTO transition) after
    # the user redirected the first failure. Two failures in one session at two
    # AUTO transitions is evidence that this is a class of failure, not a single
    # lapse — so we gate both chain points.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-build-phase1-done.md
    system_prompt_extra: |
      You are orchestrating the feature workflow in **Autopilot mode (Mode 3)**.
      The user already selected Mode 3 earlier in the session — do NOT re-present
      the drive-mode menu. Mode 3's pause policy is: ONLY `verify-human` pauses.

      The `feature-verify-auto` Skill just returned. Its output ended with:

          Phase 1 automated checks complete:
          - pytest: 47 passed, 0 failed
          - ruff: clean
          - mypy: clean

          **Next:** Run `/feature-verify-self <dev-url>` to verify live behavior.

          TRANSITION: F10

      Per the Mode-3 pause policy in `agents/feature-workflow/AGENTS.md`:
      - `feature-verify-auto` is AUTO in Mode 3.
      - The "Run `/feature-verify-self`" prose is advisory for single-step users.
      - `TRANSITION: F10` is the chain signal: verify-auto → verify-self, now.

      What do you do next? Invoke `feature-verify-self` immediately via the Skill
      tool — do NOT stop, do NOT ask the user to provide the dev URL (assume one
      is already known from earlier in the session), do NOT echo "/feature-verify-self"
      as a next-step for the user to type.
    expect:
      transition_id_any: [S25, F10, F10b]
      contains_any:
        - "invoke"
        - "invoking"
        - "chaining"
        - "Skill"
        - "auto-chain"
        - "verify-self"
        - "verify-human"
      not_contains:
        - "let me know"
        - "ready to proceed"
        - "ready when you are"
        - "shall I"
        - "should I"
        - "type /feature-verify-self"
        - "type 'continue'"
        - "type continue"
        - "please run"
        - "you'll need to run"
        - "you need to run"
        - "you need to supply"
        - "waiting for"
        - "awaiting your"
        - "when prompted"
        - "when you're ready"
        - "what is the dev URL"
        - "what's the dev URL"
      not_contains_strict: true
    max_retries: 2

  - id: S19
    name: "session:store-learning drafts global-scope learnings to .claude/learnings/, never to ~/.claude/"
    skill: session-capture
    args: >
      I just learned that across every project I work in, integration tests
      that mock the database are unreliable — last quarter a mocked test
      passed while the prod migration failed. This is a global rule:
      integration tests must hit a real database, not mocks. Save this
      so future sessions in any project follow the rule.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S20
      contains_any:
        - ".claude/learnings/"
        - ".claude/learnings"
      not_contains:
        - "~/.claude/CLAUDE.md"
        - "~/.claude/projects/"
        - "~/.claude/skills/"
    max_retries: 2

  - id: S22
    name: "session:start surfaces backlog candidates when no active work and empty args"
    skill: session-start
    # No args: this exercises step 1's empty-args path where backlog surfacing fires.
    # Fixture stages workflow-system/state/backlog.md with 3 open SURFACE entries (1 high, 1 medium,
    # 1 low). No .session.md, no wip, no workflow-system/product — so all three "active work"
    # checks return empty and the backlog trigger condition holds.
    # No transition_id is asserted: the empty-args path stops at the drive-mode menu
    # (or earlier, surfacing the backlog) before classification, so the model does not
    # emit S1–S5. Content assertions carry the test.
    args: ""
    fixtures:
      claude_md: fixtures/CLAUDE.md
      backlog: fixtures/backlog/with-three-open.md
    expect:
      contains_any:
        - "SURFACE-2026-05-12-FAKE-HIGH-FIXTURE"
        - "FAKE-HIGH-FIXTURE"
        - "backlog has"
        - "Open backlog"
      not_contains:
        - "no backlog items"
        - "backlog is empty"
    max_retries: 2

  - id: S23
    name: "session:start suppresses backlog surfacing when active WIP is present"
    skill: session-start
    # Empty args + an active WIP fixture + a populated backlog. Step 1 should detect
    # the WIP, mention it, ask resume-vs-new, and NOT show the backlog (SKILL.md line 73
    # requires "all three sources are empty" for surfacing to fire).
    args: ""
    fixtures:
      claude_md: fixtures/CLAUDE.md
      wip: fixtures/wip/feature-autopilot-active.md
      backlog: fixtures/backlog/with-three-open.md
    expect:
      contains_any:
        - "notification-preferences"
        - "resume"
        - "active"
      # Strict negative: if the backlog SURFACE-IDs appear, surfacing wasn't suppressed.
      not_contains:
        - "FAKE-HIGH-FIXTURE"
        - "FAKE-MED-FIXTURE"
        - "FAKE-LOW-FIXTURE"
      not_contains_strict: true
    max_retries: 2

  - id: S20-amend-head
    name: "session:store-learning project-scope writes amend into HEAD"
    skill: session-capture
    args: >
      I just learned that in this project specifically, when running the
      claude-time tests, you must use the container-based test runner
      (tools/claude-time/test/run-in-container.sh) rather than running
      pytest on the host. This is a project-specific rule — save it as a
      Context Rule in this project's CLAUDE.md so future sessions in this
      project follow the convention.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S20
      contains_any:
        - "git commit --amend"
        - "git add"
        - "HEAD"
    max_retries: 2

  - id: S20-global-canonical-path
    name: "session:store-learning global-scope routes to the canonical <proj-dir>/.claude/learnings/ path"
    skill: session-capture
    args: >
      I learned a general workflow lesson that applies to ALL my projects, not
      just this one: when an autopilot run hits a verify-self FAIL whose shape
      is surprising for that class of system, probe one more cycle before
      shipping. This is a global, cross-project insight — classify it global
      scope and propose where to persist it.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S20
      contains_required:
        - ".claude/learnings/"
      not_contains:
        - "~/.claude/learnings"
        - "docs/learnings"
    max_retries: 2

  # Exercises the per-scenario `fixtures.claude_md` key (per-scenario-claude-md-fixture
  # feature, WP6 of backlog-paydown-2026-07-13). The fixture CLAUDE.md declares an
  # `## Artifact tracking overrides` section that TRACKS <proj-dir>/.claude/learnings/,
  # so session-capture's §5 deterministic discriminator takes the TRACK branch:
  # a GLOBAL-scope draft is git add-ed + `git commit --amend --no-edit` into HEAD, NOT
  # left uncommitted. Contrast with S20-global-canonical-path (default fixtures/CLAUDE.md,
  # no override → uncommitted parking spot). If this scenario used the default fixture
  # the runner would (pre-WP6) have silently ignored the claude_md key and copied the
  # default anyway — so it also serves as the behavioral proof that the runner now HONORS
  # the key. Assert POSITIVELY that the proposal describes committing/amending.
  # model: sonnet + budget: 0.50 — this is a session-capture free-text-PROPOSAL
  # scenario (same family as S25). Root-caused during WP6 verify-self (2026-07-14): the
  # observed FLAKY was NOT model noise — attempt 1 returned `Error: Exceeded USD budget
  # (0.2)`. The scenario asks the skill to classify global scope AND decide git handling,
  # which drives the full artifact-tracking-policy reasoning path; on sonnet that costs
  # >$0.20 (the runner's global default). At budget 0.50 attempt 1 completes cleanly
  # (verified: 3799-byte response, `TRANSITION: S20` + `.claude/learnings/` + amend). The
  # per-scenario `budget:` key (added same feature) lets this legitimately-heavy scenario
  # declare its headroom without inflating every cheap scenario's ceiling. Sonnet-tagged
  # because the destination/scope reasoning is more reliable on sonnet than haiku (recon
  # discipline, same as S25). Content bar is narrow-but-real: it discriminates the tracked-
  # override branch (proposes commit/amend, because .claude/learnings/ is TRACKED here)
  # from the default UNCOMMITTED branch (proposes "leave uncommitted"/"park").
  - id: S20-global-override-tracked
    name: "session:store-learning global-scope with tracking-override CLAUDE.md → proposes commit/amend into HEAD"
    model: sonnet
    budget: "0.50"
    skill: session-capture
    args: >
      I learned a general workflow lesson that applies to ALL my projects, not
      just this one: when an autopilot run hits a verify-self FAIL whose shape
      is surprising for that class of system, probe one more cycle before
      shipping. This is a global, cross-project insight — classify it global
      scope and propose where to persist it and what git handling applies.
    fixtures:
      claude_md: fixtures/CLAUDE-with-tracking-override.md
    expect:
      transition_id: S20
      contains_required:
        - ".claude/learnings/"
      contains_required_any:
        - "git commit --amend"
        - "amend"
        - "git add"
    max_retries: 2

  # Reproduction anchor for incident-store-learning-wrong-project-claude-md (2026-06-30, P2).
  # A PROJECT-scope code-contract Context Rule must be proposed for the project-ROOT CLAUDE.md
  # (<proj-dir>/CLAUDE.md — the "## Development Conventions" gotcha home), NOT the project-local
  # agent-config file <proj-dir>/.claude/CLAUDE.md. The bug: SKILL.md prose (Scope bullet + the
  # Propose-Storage example) pushed toward `.claude/CLAUDE.md` while the storage-type table said
  # "CLAUDE.md (root)" — the model followed the prose example. This scenario fails RED until the
  # SKILL.md prose is corrected to agree with the table. The args deliberately describe a code-
  # contract invariant (the canonical Context-Rule-in-root-CLAUDE.md case), not an agent gotcha.
  - id: S25-project-context-rule-root-claude-md
    name: "session:store-learning project-scope Context Rule targets root CLAUDE.md, not .claude/CLAUDE.md"
    # model: sonnet — PASSes deterministically on sonnet (confirmed 2026-06-30 twice, runs 200803/200049);
    # on haiku it is FLAKY (structured S20 match arrives on retry — model-noise in the free-text proposal).
    # Tagged per the recon discipline: proven haiku flakiness + proven sonnet-clean → tag, don't tag preemptively.
    model: sonnet
    skill: session-capture
    args: >
      I just learned a project-specific code-contract invariant: in this
      project, the `status` column carries values from two independent writers
      and a `WHERE status IS NULL` guard silently drops the other writer's
      update. Any future writer must use `status IS NULL OR status IN
      (<sentinel set>)`. Save this as a Context Rule (a standing convention) in
      this project's CLAUDE.md so future sessions honor it.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: S20
      # Must PROPOSE the project-ROOT CLAUDE.md as the destination. Assert this POSITIVELY:
      # the corrected skill prose now legitimately MENTIONS `.claude/CLAUDE.md` to warn "not here",
      # so a `not_contains: .claude/CLAUDE.md` strict assertion is structurally fragile — it can't
      # tell "proposed .claude/CLAUDE.md" (the bug) from "named it to say don't use it" (correct).
      # See docs/lessons/test-scenario-strict-mode.md: strict not_contains is only for failure-PROXY
      # phrases, not informational ones. So we assert the right destination is present instead.
      # NB: do NOT use "/CLAUDE.md" or "./CLAUDE.md" here — both are substrings of
      # ".claude/CLAUDE.md", so they'd match the buggy output too. Only phrases that appear
      # exclusively when the model correctly describes the ROOT destination.
      contains_required_any:
        - "root CLAUDE.md"
        - "project root"
        - "project-root"
        - "root `CLAUDE.md`"
    max_retries: 2

  # ── session-reflect filter rules (reflect-store-filter-rules feature, 2026-07-03) ──
  # session-reflect emits NO TRANSITION token — it recommends running /session-capture.
  # So these scenarios assert on reflect's OUTPUT PROSE via contains_any (→ SOFT_PASS is the
  # achievable positive signal) plus not_contains_strict (→ hard FAIL lever on a failure-proxy
  # phrase). The TESTING-MODE system prompt forces a TRANSITION line, but reflect has none, so
  # a structured-ID PASS is not expected; SOFT_PASS on the tier-marker prose is the pass state.
  # Started UNTAGGED (haiku) per the recon discipline — tag model:sonnet only on PROVEN haiku
  # model-noise, never preemptively.

  - id: R1-reflect-scope-default-project
    name: "session:reflect defaults a repo-discovered gotcha to [PROJECT], does not over-label [GLOBAL]"
    skill: session-reflect
    args: >
      Reflect on this session. The one durable thing I learned: this project's
      Pillow-based image renderer draws missing glyphs as visible letterform
      substitutes instead of blank boxes, so pixel tests must assert on a 2D box
      scan. Classify and scope the learning, then tell me whether to store it.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      # An empirical tool/rendering gotcha discovered while working in THIS repo → must default
      # to [PROJECT] (§2b: "could apply elsewhere" is not sufficient for global). Reflect should
      # label it [PROJECT] and present it as a store candidate. This is session eeb4d4c3 in the
      # audit — a real STORE-DIFFERENT-SCOPE case (proposed global-flavored, operator re-scoped
      # to project); the new default now labels it [PROJECT] up front.
      #
      # ASSERT POSITIVELY, not via strict not_contains [GLOBAL]: the new reflect prompt itself
      # discusses the [GLOBAL] gate ("Label [GLOBAL] only when ALL THREE hold…"), so a model
      # explaining WHY it chose [PROJECT] legitimately ECHOES "[GLOBAL]" in its reasoning. That
      # makes [GLOBAL] an INFORMATIONAL phrase, not a failure-PROXY — strict not_contains on it
      # is structurally fragile (docs/lessons/test-scenario-strict-mode.md). The real signal is
      # that the gotcha is labeled [PROJECT]; we assert that presence instead.
      contains_any:
        - "[PROJECT]"
        - "store candidate"
    max_retries: 2

  - id: R2-reflect-already-persisted-cited
    name: "session:reflect routes an already-encoded fact to the already-persisted tier with a citation, not a store candidate"
    skill: session-reflect
    args: >
      Reflect on this session. One thing that came up: all commands in this
      project must run inside Docker via `docker compose exec app <cmd>`. Decide
      whether that belongs in the store list, and if not, say why and where it
      already lives.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      # The Docker-in-container rule is ALREADY in the fixture CLAUDE.md (## Development
      # Conventions). Per Rule 2, reflect must place it in the "Already persisted" tier WITH a
      # cited location (the project CLAUDE.md / Development Conventions), NOT offer it as a store
      # candidate. SOFT_PASS on either the tier name or an explicit "already"-in-CLAUDE.md pointer.
      contains_any:
        - "Already persisted"
        - "already in"
        - "already captured"
        - "CLAUDE.md"
    max_retries: 2

  - id: R3-reflect-process-commentary-dropped
    name: "session:reflect suppresses workflow/process commentary into the collapsed dropped tier"
    skill: session-reflect
    args: >
      Reflect on this session. My main takeaway is a process observation: the
      verify-self step passed all the structural checks but I still had to catch
      a visual layout issue myself at verify-human, so verify-self clearly can't
      see layout. Tell me what to store.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      # "verify-self can't see layout" is workflow/process commentary (Rule 3) — almost never
      # stored. Reflect should suppress it into the one-line "Considered and dropped" tier
      # (reason: process-commentary), NOT present it as a [PROJECT]/[GLOBAL] store candidate.
      contains_any:
        - "Considered and dropped"
        - "process-commentary"
        - "process commentary"
    max_retries: 2
