group: product
scenarios:
  # P1 is ENTRY → vision (always). Tested via session-start routing in session.yaml.

  - id: P2
    name: "product:vision → roadmap after vision created"
    skill: product-vision
    args: "A developer tool that generates API documentation from code comments and type annotations"
    fixtures:
      claude_md: fixtures/CLAUDE.md
    expect:
      transition_id: P2
      contains_any:
        - "/product-roadmap"
      not_contains:
        - "/product-research"
        - "/product-arch"
    max_retries: 2

  - id: P3
    name: "product:roadmap → research after phases defined"
    skill: product-roadmap
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/vision-done
    expect:
      transition_id: P3
      contains_any:
        - "/product-research"
      not_contains:
        - "/product-arch"
        - "/product-wbs"
    max_retries: 2

  - id: P4
    name: "product:research back-loops to roadmap when assumptions invalidated"
    skill: product-research
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/roadmap-done
    system_prompt_extra: |
      Your research found that the PoC phase assumed Python AST parsing would
      work for all Python code, but decorators and metaclasses require a
      fundamentally different approach. The PoC scope in the roadmap needs
      to be narrowed to only handle simple functions and classes. Phase 1
      assumptions are invalid.
    expect:
      transition_id: P4
      contains_any:
        - "/product-roadmap"
        - "back-loop"
        - "roadmap"
      not_contains:
        - "/product-arch"
    max_retries: 2

  - id: P5
    name: "product:research → arch when research confirms roadmap"
    skill: product-research
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/roadmap-done
    system_prompt_extra: |
      Research confirms: Python ast module handles docstring extraction well.
      Sphinx is too heavy for PoC. A custom Markdown renderer is the right
      approach. All roadmap assumptions hold. Ready to define architecture.
    expect:
      transition_id: P5
      contains_any:
        - "/product-arch"
      not_contains:
        - "/product-roadmap"
    max_retries: 2

  - id: P6
    name: "product:arch back-loops to research when unknowns found"
    skill: product-arch
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/research-done
    system_prompt_extra: |
      While defining the architecture, you realized you need to decide
      between a file-watcher approach (fsnotify) vs a git-hook approach
      for the auto-sync feature in Phase 2. This choice affects the PoC
      architecture because the file structure needs to support it. You
      don't have enough information to decide — need more research.
    expect:
      transition_id: P6
      contains_any:
        - "/product-research"
        - "back-loop"
        - "research"
      not_contains:
        - "/product-wbs"
    max_retries: 2

  - id: P7
    name: "product:arch → wbs when architecture defined"
    skill: product-arch
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/research-done
    system_prompt_extra: |
      Architecture is fully defined: Python 3.12, ast module for parsing,
      custom Markdown renderer, Click CLI. All components are clear.
      No unknowns remain. Ready to break down into work packages.
    expect:
      transition_id: P7
      contains_any:
        - "/product-wbs"
      not_contains:
        - "/product-research"
    max_retries: 2

  - id: P8
    name: "product:wbs back-loops to arch when gaps found"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/arch-done
    system_prompt_extra: |
      While decomposing into work packages, you realized the architecture
      doesn't specify how to handle output format selection (Markdown vs
      HTML vs JSON). This is an architectural decision that affects multiple
      work packages. Need to revisit architecture first.
    expect:
      transition_id: P8
      contains_any:
        - "/product-arch"
        - "back-loop"
        - "architectural"
      not_contains:
        - "/product-context"
    max_retries: 2

  - id: P9
    name: "product:wbs → context when WBS complete"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/arch-done
    system_prompt_extra: |
      The WBS is complete with 4 work packages: AST Parser, Markdown
      Renderer, CLI Interface, and Watch Mode. All dependencies are
      mapped. No architectural gaps found. Ready to generate project context.
    expect:
      transition_id: P9
      contains_any:
        - "/product-context"
      not_contains:
        - "/product-arch"
    max_retries: 2

  - id: P10
    name: "product:context exits to feature workflow"
    skill: product-context
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-done
    expect:
      transition_id: P10
      contains_any:
        - "/feature-spec"
        - "/feature-plan"
        - "feature"
      not_contains:
        - "/product-vision"
    max_retries: 2

  # P10b is the pilot scenario for `contains_required_any` (added 2026-06-13 by
  # verify-sh-contains-required). It exercises P10's transition AND hard-asserts
  # that the model surfaces the randomize-host-ports guidance when generating
  # the Docker Mandate (Variant A) CLAUDE.md content. The three OR-keywords are
  # robust to phrasing variation; any one match is sufficient. Originally drafted
  # 2026-06-06 in task codify-randomize-host-ports-test-coverage and reverted
  # there because the harness lacked the primitive — restored here as the pilot
  # use case once contains_required_any landed in tests/lib/verify.sh.
  - id: P10b
    name: "product:context Variant A output includes randomize-host-ports guidance"
    skill: product-context
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-done
    system_prompt_extra: |
      The architecture decision is Docker Mandate (Variant A). Generate the
      project's CLAUDE.md Dev Environment section using Variant A. Show the
      full Variant A content you would write, including all bullets and rules.
    expect:
      transition_id: P10
      contains_required_any:
        - "ephemeral"
        - "49152"
        - "randomize"
    max_retries: 2

  # P11 and P12 are SURFACE-IN transitions — tested by verifying source
  # workflow's SURFACE output. We test the receiving side here.

  - id: P11
    name: "product:wbs accepts SURFACE-IN for new work"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-done
    system_prompt_extra: |
      A SURFACE note arrived from feature:build. During feature implementation,
      the team discovered that a caching layer is needed between the parser
      and renderer for performance. This was not in the original WBS. You
      need to add it as a new work package and evaluate dependencies.
    expect:
      transition_id: P11
      contains_any:
        - "work package"
        - "WBS"
        - "WP"
        - "add"
      not_contains:
        - "/product-arch"
    max_retries: 2

  - id: P12
    name: "product:arch accepts SURFACE-IN for architectural gap"
    skill: product-arch
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/arch-done
    system_prompt_extra: |
      A SURFACE note arrived from feature:build. During implementation,
      the team discovered that the CLI architecture doesn't support
      plugin extensions, but a user-contributed plugin was identified as
      critical for adoption. This requires an architectural change to
      add a plugin system.
    expect:
      transition_id: P12
      contains_any:
        - "architecture"
        - "plugin"
        - "design"
      not_contains:
        - "/product-wbs"
        - "/product-context"
    max_retries: 2

  - id: P13
    name: "product:wbs with wip fixture — includes probe WP for Stripe integration"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/arch-done
      wip: fixtures/wip/feature-spec-3rdparty-no-probe.md
    system_prompt_extra: |
      You are producing the WBS for the current project. The active feature spec
      (workflow/wip/feature-spec-3rdparty-no-probe.md) describes a Stripe
      subscription billing feature. No Stripe probe WP has been completed.
      Apply learning-sequence ordering: the WBS must include a probe work
      package for Stripe before any build WP that assumes known Stripe API
      shapes. Include a brief ordering rationale per phase.
    expect:
      transition_id: P13
      contains_any:
        - "probe"
        - "Probe"
        - "spike"
        - "Spike"
        - "Learning objective"
      not_contains:
        - "no probe"
        - "skip probe"
    max_retries: 2

  - id: P9b
    name: "product:wbs includes probe WP and ordering rationale for 3rd-party integration"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/arch-done
    system_prompt_extra: |
      You are decomposing a project that includes a Stripe payment integration.
      The architecture specifies: a subscription billing feature that calls the
      Stripe API to create and manage PaymentIntents. No prior probe or spike
      has been done on the Stripe API. Produce the WBS now.

      IMPORTANT: Apply the learning-sequence ordering rules. A 3rd-party
      integration is present (Stripe). Ensure the WBS includes a probe WP
      for Stripe before any build WP that assumes known Stripe API shapes.
      Also include a brief ordering rationale for each phase.
    expect:
      transition_id: P9b
      contains_any:
        - "probe"
        - "Probe"
        - "spike"
        - "Spike"
        - "Learning objective"
      not_contains:
        - "no probe"
        - "skip probe"
    max_retries: 2

  - id: P13b
    name: "product:product-finalize exits when all WPS complete and docs archived"
    skill: product-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-complete
    system_prompt_extra: |
      You are running product-finalize for the "API Documentation Generator" cycle.
      All WPs in wbs.md are marked [x]. docs/product/arch.md exists and is accurate.
      workflow/backlog.md is empty. The cycle name is "api-doc-generator-v1".
      Complete the finalize procedure and exit.
    expect:
      transition_id: P13
      contains_any:
        - "archive"
        - "archived"
        - "docs/product/archive"
        - "product cycle"
      not_contains:
        - "/product-arch"
        - "incomplete"
    max_retries: 2

  - id: P14
    name: "product:product-finalize back-loops to arch on significant drift"
    skill: product-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-complete
    system_prompt_extra: |
      You are running product-finalize for the "API Documentation Generator" cycle.
      All WPs in wbs.md are marked [x]. However, during the resync step you discover
      that arch.md describes a planned plugin system that was never built — the team
      decided during implementation to drop plugin support entirely and use a different
      extension model. This is significant architectural drift that must be formally
      documented in arch.md before archiving. Trigger the back-loop to product-arch.
    expect:
      transition_id: P14
      contains_any:
        - "/product-arch"
        - "product-arch"
        - "arch"
        - "back-loop"
        - "drift"
      not_contains:
        - "archive"
        - "EXIT"
    max_retries: 2

  # F-CHGLOG-4: product-finalize appends to project CHANGELOG.md
  # Test-only ID — no entry in transitions.md's main table; this asserts a side-effect of P13.
  - id: F-CHGLOG-4
    name: "product:product-finalize appends Product cycle complete line to CHANGELOG.md"
    skill: product-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-complete
    system_prompt_extra: |
      You are running product-finalize for the "API Documentation Generator" cycle.
      All WPs in wbs.md are marked [x]. docs/product/arch.md exists and is accurate.
      workflow/backlog.md is empty. The cycle name is "api-doc-generator-v1".
      Per the CHANGELOG.md convention documented in ~/.claude/CLAUDE.md (injected
      from CLAUDE.snippet.md), before exiting, append one **Product cycle complete:**
      summary bullet to <proj_root>/CHANGELOG.md under today's date heading,
      summarizing what the cycle delivered in one sentence. Per-WP **Milestone:**
      lines were emitted by feature-finalize at WP-completion time and are not
      re-emitted here. Complete the finalize procedure and exit.
    expect:
      transition_id: P13
      contains_any:
        - "CHANGELOG"
        - "**Product cycle complete:**"
        - "Product cycle complete"
      not_contains: []
    max_retries: 2

  - id: P13-no-auto-push
    name: "product:product-finalize cycle-close commit does NOT auto-push"
    skill: product-finalize
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-complete
    system_prompt_extra: |
      You are running product-finalize for the "API Documentation Generator" cycle.
      All WPs in wbs.md are marked [x]. arch.md is accurate. backlog.md is empty.
      The cycle name is "api-doc-generator-v1". When describing the §6b operational
      sequence (CHANGELOG append + cycle-close commit), confirm what happens
      regarding pushing the cycle-close commit upstream.
    expect:
      transition_id: P13
      contains_any:
        - "Do NOT"
        - "do not push"
        - "operator"
        - "land locally"
    # Part of the no-push family — keep contains_any in sync across F19/T10/I10/P13-no-auto-push
    max_retries: 2

  # ── Design priors — CONSULT side (product-roadmap / product-wbs) ──────────────
  # These exercise the design-priors consult contract added 2026-06-26. The fixture
  # design-priors-consult/ carries vision + roadmap + a design-priors.md with priors
  # P-FOCUS (audience=solo-founders, resist breadth) and P-ANTI (anti-persona=spreadsheet-lovers).

  # NB: these scenarios assert CONTENT (does a design prior fire / not fire), which is
  # orthogonal to WHICH transition the planning skill picks. So they use transition_id_any
  # (the skill's plausible exits) to anchor an ID match, then contains_required_any /
  # not_contains_strict do the real behavioral assertion. not_contains_strict:true makes a
  # spurious prior-firing a HARD FAIL — that strictness is the anti-overfit proof the operator
  # mandated. The disclosure token is matched as "PRIOR:" (no leading "[", which is a BRE
  # bracket-expression and breaks grep in verify.sh).

  - id: DP-consult-changes
    name: "design-priors: a governing prior CHANGES a product-design gap-fill (cites the prior)"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/design-priors-consult
    system_prompt_extra: |
      Decompose the next milestone into WPs. One open product-design question:
      should the import feature also serve agencies/teams (multi-seat), or stay
      single-operator? This is on the SAME axis as a recorded design prior
      (P-FOCUS: solo founders only, resist breadth toward agencies/teams).
      Consult design-priors.md and apply the consult-weighting rules; disclose the
      firing prior.
    expect:
      transition_id_any: [P7, P8, P9, P9b, P11, P12]
      contains_required_any:
        - "PRIOR: P"
        - "P-FOCUS"
      contains_any:
        - "solo"
        - "focus"
        - "resist breadth"
    max_retries: 2

  - id: DP-consult-nochange-overinfer
    name: "design-priors: B6 over-infer trap — prior on a DIFFERENT axis does NOT fire"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/design-priors-consult
    system_prompt_extra: |
      Decompose the next milestone into WPs. One open product-design question:
      what TONE should error messages use — terse or friendly? The recorded
      design priors (P-FOCUS: audience breadth; P-ANTI: spreadsheet anti-persona)
      are about AUDIENCE, NOT about copy tone. Per the over-infer guard, a prior
      only fires on the axis it actually governs. Decide error-message tone from
      common sense; do NOT cite or stretch an audience prior onto a copy-tone decision.
    expect:
      transition_id_any: [P7, P8, P9, P9b, P11, P12]
      # The over-infer guard must hold: NO design-prior may FIRE on a copy-tone decision
      # no recorded prior governs. The failure-proxy is the DISCLOSURE-WITH-SLUG form
      # `PRIOR: P-...` (the `[PRIOR: <slug>]` disclosure is emitted ONLY when a prior
      # actually fires on this decision). We match `PRIOR: P` (slug follows) rather than
      # bare "PRIOR:" so a NEGATED mention ("no PRIOR disclosure applies here") does not
      # trip it, and we do NOT strict-ban the prior NAMES — naming them while reasoning
      # "these are about audience, not tone, so they don't apply" is CORRECT behavior
      # (per docs/lessons/test-scenario-strict-mode.md: strict mode = failure-proxy only).
      not_contains:
        - "PRIOR: P"
      not_contains_strict: true
    max_retries: 2

  - id: DP-consult-noprior-90pct
    name: "design-priors: no design-priors.md present → normal decision (90% path untouched)"
    skill: product-wbs
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/roadmap-done
    system_prompt_extra: |
      Decompose the next milestone into WPs. There is NO design-priors.md in
      docs/product/. Make ordinary product-design decisions from common sense.
      Do not invent or fabricate a design prior that does not exist.
    expect:
      transition_id_any: [P7, P8, P9, P9b, P11, P12]
      not_contains:
        - "PRIOR:"
      not_contains_strict: true
    max_retries: 2

  - id: DP-consult-contradiction
    name: "design-priors: clear default CONTRADICTS a strong prior → surfaces a proposal, never silently steers"
    skill: product-roadmap
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/design-priors-consult
    system_prompt_extra: |
      Revise the roadmap. A teammate-collaboration milestone looks like an obvious
      next step (most tools add collaboration eventually — strong common-sense default).
      But recorded prior P-FOCUS says single-operator is the product's identity.
      This is the 10% contradiction case. Per the consult rules, surface this as a
      PROPOSAL with disclosure — do NOT silently add the collaboration milestone and
      do NOT silently drop it. Flag the tension for the operator.
    expect:
      transition_id_any: [P3, P4]
      contains_required_any:
        - "PRIOR:"
        - "P-FOCUS"
      contains_any:
        - "propose"
        - "proposal"
        - "flag"
        - "surface"
    max_retries: 2

  # ── Design priors — CAPTURE side (product-vision / product-arch) ──────────────

  - id: DP-capture-fires
    name: "design-priors: capture FIRES on a principled tradeoff with a transferable why (proposes a prior)"
    skill: product-vision
    fixtures:
      claude_md: fixtures/CLAUDE.md
    args: "A personal finance tool"
    system_prompt_extra: |
      The operator states: "This is laser-focused on solo founders — I am NOT
      building for agencies or teams, because the whole bet is depth for that one
      demographic. Breadth would dilute the wedge." This is an identity/anti-persona
      statement with a transferable why — a design prior. Per §2b, propose recording
      it to design-priors.md (propose-never-auto-write).
    # product-vision does not carry an "Emit Transition" section, so it asserts on the
    # SOFT_PASS content path (like the existing P2 scenario), not a structured ID match.
    expect:
      transition_id_any: [P2, P1]
      contains_any:
        - "design-priors.md"
        - "design prior"
    max_retries: 2

  - id: DP-capture-skips-bare-fact
    name: "design-priors: capture SKIPS a bare one-off fact (not a prior)"
    skill: product-vision
    fixtures:
      claude_md: fixtures/CLAUDE.md
    args: "A personal finance tool"
    system_prompt_extra: |
      The operator states only: "Use a dark-blue accent color for the brand."
      This is a bare aesthetic preference with NO transferable design-decision why —
      it is a FACT, not a design prior. Do NOT propose recording a design prior for it.
    # Failure-proxy: proposing to WRITE the bare fact to design-priors.md. We need a
    # content anchor for the SOFT_PASS path, so contains_any matches the normal vision
    # handoff prose; not_contains_strict bans the design-priors write-proposal.
    expect:
      transition_id_any: [P2, P1]
      contains_any:
        - "/product-roadmap"
        - "vision"
      not_contains:
        - "design-priors.md"
      not_contains_strict: true
    max_retries: 2

  - id: DP-capture-skips-arch-tradeoff
    name: "design-priors: capture SKIPS a technical/arch tradeoff (boundary exclusion → arch.md)"
    skill: product-arch
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/roadmap-done
    system_prompt_extra: |
      The operator chooses SQLite over Postgres to keep deploy to a single binary.
      This is a TECHNICAL/stack tradeoff — per the arch-boundary exclusion it belongs
      in arch.md, NOT in design-priors.md. Record it as an arch Key Decision; do NOT
      propose it as a design prior.
    expect:
      transition_id_any: [P7, P6]
      contains_any:
        - "arch.md"
        - "Key Decision"
        - "SQLite"
      not_contains:
        - "design-priors.md"
    max_retries: 2
