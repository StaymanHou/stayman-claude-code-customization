group: util
# Behavioral scenarios for util-backlog-paydown.
#
# Disposition cases are GENERALIZED/REDACTED from two real regression sessions (a debt
# sweep + a five-sweep family) — the fixture tests/fixtures/backlog/sweep-mixed.md carries
# no real file paths, component names, SURFACE IDs, or project identifiers. These two
# sessions are the disposition model's regression suite (see
# docs/lessons/between-milestone-debt-paydown-sweep.md): the model must predict the
# include/exclude calls those sessions actually made.
#
# util-backlog-paydown is a util-* skill — it emits NO workflow transition token. So the
# four disposition scenarios assert via contains_any only (verify.sh enforces
# contains_required only inside a transition match; with no transition the path is the
# contains_any SOFT_PASS branch). SOFT_PASS counts as passing. We pin each scenario to its
# fixture in Dry-run (mode 4) so the run is deterministic and side-effect-free, and assert
# the model lands the EXPECTED action on the probe item while NOT mislabeling it.
#
# The fifth scenario exercises the product-finalize advisory-pointer integration boundary:
# product-finalize DOES emit a transition (P13/P14), so that one is a hard PASS with a
# contains_required pin that the /util-backlog-paydown pointer prose is present.

scenarios:
  - id: UTIL-PAYDOWN-CHEAP-SAFE-SWEEP
    name: "util-backlog-paydown: cheap+safe item → Sweep (Rule 1, no exception)"
    skill: util-backlog-paydown
    args: >
      Mode 4 (dry-run). Run the between-milestone backlog-paydown sweep over the standing
      backlog. Focus your reported disposition on item CQ-1 (the unused dependency + stale
      comments — verified dead, XS effort, XS risk). What action does the disposition model
      assign it, and why?
    fixtures:
      claude_md: fixtures/CLAUDE.md
      backlog: fixtures/backlog/sweep-mixed.md
    expect:
      contains_any:
        - "Sweep"
        - "Rule 1"
        - "cheap"
      # No not_contains: the model legitimately names other actions (Bury/Defer/…) while
      # explaining the disposition vocabulary — an informational mention, not a failure
      # proxy. Per docs/lessons/test-scenario-strict-mode.md, not_contains on informational
      # phrases is fragile; the contains_any on the EXPECTED action is the real assertion.
    max_retries: 2

  - id: UTIL-PAYDOWN-HIGH-EFFORT-HIGH-IMPACT-DISCUSS
    name: "util-backlog-paydown: high-effort + high-impact (and high-risk) item → Discuss"
    skill: util-backlog-paydown
    args: >
      Mode 4 (dry-run). Run the backlog-paydown sweep. Focus your reported disposition on
      item DEC-1 (the auth-boundary hardening for a privileged shell — high impact, high
      effort for the full fix, high risk; the doc-comments overstate the guarantee). What
      action does the disposition model assign it, and what do you surface to the operator?
    fixtures:
      claude_md: fixtures/CLAUDE.md
      backlog: fixtures/backlog/sweep-mixed.md
    expect:
      contains_any:
        - "Discuss"
        - "make the code honest"
        - "surface to"
    max_retries: 2

  - id: UTIL-PAYDOWN-GATED-DEFER
    name: "util-backlog-paydown: gated-on-precondition item → Defer (anchored)"
    skill: util-backlog-paydown
    args: >
      Mode 4 (dry-run). Run the backlog-paydown sweep. Focus your reported disposition on
      item GATE-1 (deprecate a legacy source pipeline — blocked on the operator precondition
      that the replacement must soak in production for several weeks first). What action does
      the model assign it?
    fixtures:
      claude_md: fixtures/CLAUDE.md
      backlog: fixtures/backlog/sweep-mixed.md
    expect:
      contains_any:
        - "Defer"
        - "gated"
        - "anchor"
    max_retries: 2

  - id: UTIL-PAYDOWN-MEH-BURY
    name: "util-backlog-paydown: low-impact + medium-effort + low-risk item → Bury (the meh zone)"
    skill: util-backlog-paydown
    args: >
      Mode 4 (dry-run). Run the backlog-paydown sweep. Focus your reported disposition on item
      MEH-1 (a component test-infra build-out — low feature value, medium effort to stand up,
      low risk; not cheap enough to be free, not valuable enough to prioritize). What action
      does the disposition model assign it?
    fixtures:
      claude_md: fixtures/CLAUDE.md
      backlog: fixtures/backlog/sweep-mixed.md
    expect:
      contains_any:
        - "Bury"
        - "meh"
        - "archived backlog"
    max_retries: 2

  - id: UTIL-PAYDOWN-OUT-OF-SCOPE-VETO-DELETE
    name: "util-backlog-paydown: out-of-scope-by-design item → operator-veto Delete"
    skill: util-backlog-paydown
    args: >
      Mode 4 (dry-run). Run the backlog-paydown sweep. Focus your reported disposition on
      item OOS-1 (a host-only build failure; the project is containerized-by-design and
      running on the host is explicitly unsupported). The operator considers this not a real
      problem. What action does the model assign it, and is operator-veto in play?
    fixtures:
      claude_md: fixtures/CLAUDE.md
      backlog: fixtures/backlog/sweep-mixed.md
    expect:
      contains_any:
        - "Delete"
        - "operator veto"
        - "out of scope"
    max_retries: 2

  - id: UTIL-PAYDOWN-FINALIZE-POINTER-ADVISORY
    name: "product-finalize: advisory /util-backlog-paydown pointer present but stays advisory (no divert)"
    skill: product-finalize
    args: >
      All WBS work packages are complete. Run the product cycle finalize. During the backlog
      sweep you find several deferred code-quality / refactor items that this cycle did not
      address. Proceed through resync, roadmap check, backlog sweep, archive, and CHANGELOG.
    fixtures:
      claude_md: fixtures/CLAUDE.md
      product_dir: fixtures/product/wbs-complete
    # product-finalize DOES emit a transition. With an all-[x] WBS it emits P13 (cycle close).
    # The advisory pointer must be PRESENT (contains_required) but must NOT divert the skill's
    # own exit — it still emits P13. This is the integration-boundary codify test for the
    # product-finalize edit (P2.2): the pointer stays advisory and does not auto-chain.
    expect:
      transition_id: "P13"
      contains_required:
        - "util-backlog-paydown"
    max_retries: 2

  # ── util-grill-me — the three-clause gate ────────────────────────────────────
  #
  # util-grill-me emits NO transition (util-* category), so these assert via
  # contains_any on the SOFT_PASS branch, same as the paydown disposition cases above.
  #
  # PROMPT-LEAKAGE DISCIPLINE (docs/lessons/test-scenario-prompt-leakage.md): each
  # system_prompt_extra states the DECISION CONTEXT neutrally — the situation and the
  # environmental facts — and never the expected answer or the rule's name. A scenario
  # that recites "clause (c) says don't ask about cheap decisions" would pass even if
  # the gate were deleted from the skill, testing prompt-obedience instead of the skill.
  # Verify that property when editing: strip the block from SKILL.md and these must fail.
  #
  # Untagged (haiku) per the repo's recon discipline — a `model: sonnet` tag is earned by
  # a MEASURED haiku failure plus a confirmed-deterministic sonnet pass, not added
  # preemptively. NB this feature measured DP-capture-fires at ~85% on BOTH tiers, so if
  # one of these proves flaky do not reach for the tag reflexively; measure both first.

  - id: UTIL-GRILL-GATE-FIRES-ON-EXPENSIVE
    name: "util-grill-me: asks when the decision is the operator's AND expensive to reverse"
    skill: util-grill-me
    args: >
      Grill me on the user-data export API plan before I build it. The plan and the
      environmental facts are already in your context.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    system_prompt_extra: |
      The plan under discussion: "Add a public HTTP API for exporting user data."
      Environmental facts available to you: the repo has no existing export endpoint,
      no rate-limiting middleware, and no documented retention policy. The operator has
      not said who the export is for, whether it must include deleted records, or what
      happens to an export that is half-written when a request times out. Those choices
      determine the response schema and the storage layout, and changing them after
      release would break any client already parsing the payload.
    expect:
      contains_any:
        - "Gate check"
        - "passing all three clauses"
      contains_required_any:
        - "recommended answer"
        - "Recommended answer"
        - "My recommendation"
    max_retries: 2

  - id: UTIL-GRILL-GATE-SKIPS-CHEAP-REVERSIBLE
    name: "util-grill-me: does NOT ask about a cheap-to-reverse decision (clause (c))"
    skill: util-grill-me
    args: >
      Grill me on the --quiet flag change before I build it. The change and the
      environmental facts are already in your context.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    system_prompt_extra: |
      The change under discussion: "Add a --quiet flag to the existing log-tail command."
      Environmental facts available to you: the command already parses flags in one place,
      the behavior is a single early-return around one writer, and it ships behind no
      public contract. The only things not yet settled are what to call the flag's short
      form, whether the suppressed line reads "skipped" or "omitted" in the summary, and
      whether --quiet sorts before or after --verbose in the help text. Any of those can
      be changed later by editing one line.
    expect:
      contains_any:
        - "Gate check"
        - "passing all three clauses"
      # NB `cheap to reverse` was REMOVED from this OR-fanout on review (2026-07-29). It is one
      # of the three literal reason-strings in the skill's own Assumed-list template
      # (util-grill-me/SKILL.md: "discoverable / not the operator's / cheap to reverse"), so it
      # is emitted whenever ANY default is disclosed with that reason — including in a run that
      # wrongly asked all three cheap questions and then disclosed some unrelated cheap default.
      # An OR-fanout is only as strong as its weakest arm, and that arm was satisfiable by the
      # very failure state this scenario exists to reject. The surviving arms are all
      # failure-DISCRIMINATING: they can only appear when the model actually declined to ask.
      contains_required_any:
        - "clauses: none"
        - "clauses:** none"
        - "fail clause (c)"
        - "no questions"
        - "none of the"
    max_retries: 2

  - id: UTIL-GRILL-GATE-LOOKS-UP-DISCOVERABLE-FACT
    name: "util-grill-me: looks a discoverable fact up instead of asking (clause (a))"
    skill: util-grill-me
    args: >
      Grill me on the workflow-state directory migration before I build it. The migration
      and the environmental facts are already in your context.
    fixtures:
      claude_md: fixtures/CLAUDE.md
    system_prompt_extra: |
      The migration under discussion: "Move the workflow state directory to a new path."
      Environmental facts available to you: the current path, the set of files under it,
      and every skill that reads or writes it are all recorded in the project's own
      CLAUDE.md and are readable from the filesystem right now. What the operator has NOT
      stated is whether existing projects must keep working without a manual step, which
      determines whether this needs a compatibility shim that would be costly to retrofit.
    expect:
      contains_any:
        - "Gate check"
        - "passing all three clauses"
      contains_required_any:
        - "resolved from the environment"
        - "Looked up rather than asked"
        - "looked up rather than asked"
        - "discoverable"
    max_retries: 2
